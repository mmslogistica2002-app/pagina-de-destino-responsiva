 grupos.forEach(g=>{out+=`\n\n*${String(g.localidade).toUpperCase()}*`;if(g.semAtendimento&&!g.itens.length){out+='\n\n*Não há atendimento*';return}g.itens.forEach(x=>{out+='\n\n'+camposCompartilhamentoProg(x,incluirTelefone).map(([label,valor])=>`*${label}:* ${valor}`).join('\n')})});
 return out
}
function empresasParaCompartilhamento(data){let existentes=getProgramacoes().filter(x=>x.data===data).map(x=>String(x.empresa||'').trim()).filter(Boolean);let lista=[...PROG_EMPRESAS,...existentes];return [...new Set(lista)].sort((a,b)=>{let ia=PROG_EMPRESAS.indexOf(a),ib=PROG_EMPRESAS.indexOf(b);if(ia>=0&&ib>=0)return ia-ib;if(ia>=0)return -1;if(ib>=0)return 1;return a.localeCompare(b,'pt-BR')})}
function abrirSelecaoCompartilhamento(modo,data){
 let empresas=empresasParaCompartilhamento(data),locais=[...PROG_LOCAIS,...[...new Set(getProgramacoes().filter(x=>x.data===data).map(x=>x.localidade).filter(Boolean))].filter(l=>!PROG_LOCAIS.includes(l))];
 let ehtml=empresas.map(e=>`<label class="prog-share-check"><input type="checkbox" data-share-empresa value="${esc(e)}" checked onchange="sincronizarTodasCompartilhamento('empresa')"><span>${esc(e)}</span></label>`).join('');
 let lhtml=locais.map(l=>`<label class="prog-share-check"><input type="checkbox" data-share-local value="${esc(l)}" checked onchange="sincronizarTodasCompartilhamento('local')"><span>${esc(l)}</span></label>`).join('');
 let titulo=modo==='whatsapp'?'Selecionar conteúdo para WhatsApp':'Selecionar conteúdo para PDF',acao=modo==='whatsapp'?'Copiar texto formatado':'Gerar PDF dos selecionados';
 document.getElementById('progShareModal')?.remove();
 document.body.insertAdjacentHTML('beforeend',`<div class="prog-share-overlay" id="progShareModal" data-modo="${modo}" data-data="${esc(data)}" role="dialog" aria-modal="true" aria-labelledby="progShareTitle"><div class="prog-share-dialog"><div class="prog-share-head"><div><h2 id="progShareTitle">${titulo}</h2><p>Escolha as empresas e localidades que deverão aparecer na programação de ${esc(progData(data))}. Você pode selecionar mais de uma opção.</p></div><button class="btn outline small" type="button" onclick="fecharSelecaoCompartilhamento()" aria-label="Fechar">✕</button></div><div class="prog-share-body"><div class="prog-share-columns"><section class="prog-share-group"><h3>Empresas</h3><label class="prog-share-check all"><input type="checkbox" id="shareTodasEmpresas" checked onchange="marcarTodasCompartilhamento('empresa',this.checked)"><span>TODAS AS EMPRESAS</span></label><div class="prog-share-options">${ehtml||'<span class="muted">Nenhuma empresa cadastrada.</span>'}</div></section><section class="prog-share-group"><h3>Localidades</h3><label class="prog-share-check all"><input type="checkbox" id="shareTodasLocais" checked onchange="marcarTodasCompartilhamento('local',this.checked)"><span>TODAS AS LOCALIDADES</span></label><div class="prog-share-options">${lhtml||'<span class="muted">Nenhuma localidade cadastrada.</span>'}</div></section></div><label class="prog-share-check prog-share-phone-option"><input type="checkbox" id="shareAdicionarTelefone" checked><span>Adicionar números de telefone dos prepostos</span></label><div class="notice" style="margin:12px 0 0">Somente atendimentos não cancelados da data selecionada serão incluídos. Se uma localidade estiver marcada como “Não há atendimento”, essa informação aparecerá no compartilhamento. Os dados originais da programação não serão alterados.</div></div><div class="prog-share-foot"><button class="btn secondary" type="button" onclick="fecharSelecaoCompartilhamento()">Cancelar</button><button class="btn primary" type="button" onclick="executarCompartilhamentoProg()">${acao}</button></div></div></div>`)
}
function marcarTodasCompartilhamento(tipo,marcar){document.querySelectorAll(`[data-share-${tipo}]`).forEach(c=>c.checked=!!marcar)}
function sincronizarTodasCompartilhamento(tipo){let itens=[...document.querySelectorAll(`[data-share-${tipo}]`)],id=tipo==='empresa'?'shareTodasEmpresas':'shareTodasLocais',all=document.getElementById(id);if(all)all.checked=itens.length>0&&itens.every(c=>c.checked)}
function fecharSelecaoCompartilhamento(){document.getElementById('progShareModal')?.remove()}
function gerarHtmlPdfProgramacao(data,grupos,incluirTelefone=true){
 let secoes=grupos.map(g=>`<section class="local-section"><h2>${esc(String(g.localidade).toUpperCase())}</h2>${g.semAtendimento&&!g.itens.length?'<p class="no-attendance">Não há atendimento</p>':g.itens.map(x=>`<article class="attendance">${camposCompartilhamentoProg(x,incluirTelefone).map(([label,valor])=>`<div class="line"><strong>${esc(label)}:</strong> <span>${esc(valor)}</span></div>`).join('')}</article>`).join('')}</section>`).join('');
 return `<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><title>Programação MMS ${esc(progData(data))}</title><style>*{box-sizing:border-box}body{font:14px Arial,sans-serif;padding:30px;color:#172033;max-width:900px;margin:0 auto}header{border-bottom:3px solid #08a9dc;padding-bottom:14px;margin-bottom:22px}h1{font-size:22px;color:#403b88;margin:0 0 5px}.sub{font-size:13px;color:#526079;margin:0}.date{font-weight:800;font-size:17px;margin-top:12px}.local-section{margin:22px 0 26px;page-break-inside:avoid}.local-section h2{font-size:16px;color:#174a70;border-bottom:1px solid #b8d9e7;padding:0 0 8px;margin:0 0 12px}.attendance{border:1px solid #dce4ed;border-radius:9px;padding:13px 15px;margin:0 0 12px;page-break-inside:avoid}.line{line-height:1.55;overflow-wrap:anywhere}.line span{white-space:pre-wrap}.line strong{font-weight:700}.no-attendance{font-weight:700;color:#526079;background:#f3f6f9;border-radius:8px;padding:11px 13px}@media print{body{padding:0;max-width:none}.attendance{break-inside:avoid}.local-section{break-inside:auto}}</style></head><body><header><h1>MMS SUPORTE LOGÍSTICA</h1><p class="sub">Programação operacional</p><div class="date">${esc(dataComDiaSemanaProg(data))}</div></header>${secoes||'<p>Nenhum atendimento encontrado para os filtros selecionados.</p>'}<script>window.onload=()=>window.print()<\/script></body></html>`
}
function executarCompartilhamentoProg(){
 let modal=document.getElementById('progShareModal');if(!modal)return;
 let modo=modal.dataset.modo,data=modal.dataset.data,empresas=[...modal.querySelectorAll('[data-share-empresa]:checked')].map(c=>c.value),locais=[...modal.querySelectorAll('[data-share-local]:checked')].map(c=>c.value),incluirTelefone=document.getElementById('shareAdicionarTelefone')?.checked!==false;
 if(!empresas.length)return alert('Selecione pelo menos uma empresa ou marque Todas as empresas.');
 if(!locais.length)return alert('Selecione pelo menos uma localidade ou marque Todas as localidades.');
 let {grupos}=listarProgramacoesCompartilhamento(data,empresas,locais);
 if(!grupos.length)return alert('Não há atendimentos nem localidades marcadas como “Não há atendimento” para as empresas e localidades selecionadas nesta data.');
 if(modo==='whatsapp'){let texto=textoProg(data,empresas,locais,incluirTelefone);fecharSelecaoCompartilhamento();copiarProgramacaoWhatsApp(texto);return}
 let w=window.open('','_blank');if(!w)return alert('Permita a abertura de janelas para gerar o PDF.');w.document.open();w.document.write(gerarHtmlPdfProgramacao(data,grupos,incluirTelefone));w.document.close();fecharSelecaoCompartilhamento()
}
async function copiarProgramacaoWhatsApp(texto,mensagem='Programação formatada copiada. Agora é só colar no WhatsApp.'){try{if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(texto);alert(mensagem);return}}catch(e){}let ta=document.createElement('textarea');ta.value=texto;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();let ok=false;try{ok=document.execCommand('copy')}catch(e){}ta.remove();if(ok)alert(mensagem);else prompt('Copie o conteúdo abaixo:',texto)}
function compartilharProg(data){abrirSelecaoCompartilhamento('whatsapp',data)}
function imprimirProg(data){abrirSelecaoCompartilhamento('pdf',data)}
function alterarStatusProg(id){if(!exigirEditorProgramacao())return;const contexto=capturarContextoProgramacao();let x=getProgramacoes().find(a=>a.id===id);if(!x)return;let st=prompt('Novo status:\n'+PROG_STATUS.join(' / '),x.status);if(!st)return;if(!PROG_STATUS.includes(st))return alert('Status inválido.');let lista=getProgramacoes().map(a=>a.id===id?{...a,status:st,atualizadoEm:new Date().toISOString(),historico:[...(a.historico||[]),{em:new Date().toISOString(),por:state.user.name,acao:'Status alterado',statusAnterior:a.status,statusNovo:st}]}:a);salvarProgramacoes(lista);voltarContextoProgramacao(contexto,x.data)}
function excluirAtendimento(id){if(!exigirEditorProgramacao())return;const contexto=capturarContextoProgramacao();const registro=getProgramacoes().find(x=>x.id===id);if(!registro)return;if(!confirm('Excluir este atendimento?'))return;salvarProgramacoes(getProgramacoes().filter(x=>x.id!==id));voltarContextoProgramacao(contexto,registro.data)}
function historicoProgramacao(contexto=null){let lista=getProgramacoes().slice().sort((a,b)=>(b.data||'').localeCompare(a.data||''));const f=contexto?.filters||{};shell(`${pageTitle('Histórico de programações','Consulte e edite atendimentos cadastrados')}<div class="panel"><div class="form-grid"><div class="field"><label>Empresa</label><input id="histEmpresa" placeholder="Filtrar empresa" value="${esc(f.empresa||'')}" oninput="filtrarHistoricoProg()"></div><div class="field"><label>Localidade</label><select id="histLocal" onchange="filtrarHistoricoProg()"><option value="">Todas</option>${PROG_LOCAIS.map(l=>`<option ${f.local===l?'selected':''}>${l}</option>`).join('')}</select></div><div class="field"><label>Ponto de atendimento</label><input id="histPonto" placeholder="Filtrar aeroporto, porto, estaleiro..." value="${esc(f.ponto||'')}" oninput="filtrarHistoricoProg()"></div><div class="field"><label>Status</label><select id="histStatus" onchange="filtrarHistoricoProg()"><option value="">Todos</option>${PROG_STATUS.map(s=>`<option ${f.status===s?'selected':''}>${s}</option>`).join('')}</select></div><div class="field"><label>Mês</label><input type="month" id="histMes" value="${esc(f.mes||'')}" onchange="filtrarHistoricoProg()"></div></div></div><div id="histResultados" style="margin-top:16px">${lista.map(x=>`<article class="panel" style="margin-bottom:12px">${detalhesProg(x)}</article>`).join('')||'<div class="panel muted">Nenhum atendimento cadastrado.</div>'}</div>`);if(contexto){filtrarHistoricoProg();restaurarScrollProgramacao(contexto.scrollY||0,[])} }
function filtrarHistoricoProg(){let emp=(document.getElementById('histEmpresa').value||'').toLowerCase(),loc=document.getElementById('histLocal').value,ponto=(document.getElementById('histPonto').value||'').toLowerCase(),st=document.getElementById('histStatus').value,mes=document.getElementById('histMes').value;let arr=getProgramacoes().filter(x=>(!emp||x.empresa.toLowerCase().includes(emp))&&(!loc||x.localidade===loc)&&(!ponto||(x.pontoAtendimento||'').toLowerCase().includes(ponto))&&(!st||x.status===st)&&(!mes||x.data.startsWith(mes))).sort((a,b)=>b.data.localeCompare(a.data));document.getElementById('histResultados').innerHTML=arr.map(x=>`<article class="panel" style="margin-bottom:12px">${detalhesProg(x)}</article>`).join('')||'<div class="panel muted">Nenhum resultado encontrado.</div>'}
function relatorioMensal(){let mes=hojeISO().slice(0,7);shell(`${pageTitle('Relatório mensal','Consolide atendimentos por empresa, localidade e tipo')}<div class="panel"><div class="form-grid"><div class="field"><label>Mês de referência</label><input type="month" id="relMes" value="${mes}"></div><div class="field"><label>Empresa (opcional)</label><input id="relEmpresa" placeholder="Todas as empresas"></div><div class="field"><label>Localidade</label><select id="relLocal"><option value="">Todas</option>${PROG_LOCAIS.map(l=>`<option>${l}</option>`).join('')}</select></div><div class="field"><label>Ponto de atendimento</label><input id="relPonto" placeholder="Aeroporto, porto, estaleiro..."></div><div class="field"><label>Status</label><select id="relStatus"><option value="">Todos</option>${PROG_STATUS.map(st=>`<option>${st}</option>`).join('')}</select></div></div><div class="toolbar"><button class="btn primary" onclick="gerarRelatorioMensal()">Gerar relatório</button></div></div><div id="relResultado"></div>`)}
function gerarRelatorioMensal(){let mes=document.getElementById('relMes').value,emp=(document.getElementById('relEmpresa').value||'').toLowerCase(),loc=document.getElementById('relLocal').value,ponto=(document.getElementById('relPonto').value||'').toLowerCase(),st=document.getElementById('relStatus').value;let arr=getProgramacoes().filter(x=>x.data.startsWith(mes)&&(!emp||x.empresa.toLowerCase().includes(emp))&&(!loc||x.localidade===loc)&&(!ponto||(x.pontoAtendimento||'').toLowerCase().includes(ponto))&&(!st||x.status===st));let grupos={};arr.forEach(x=>{grupos[x.empresa]=grupos[x.empresa]||[];grupos[x.empresa].push(x)});let html=`<div class="section-head"><div><h2>Resultado · ${mes}</h2><p>${arr.length} atendimento(s) encontrado(s)</p></div><button class="btn outline" onclick="imprimirRelatorioMensal()">PDF / Imprimir</button></div>`+Object.entries(grupos).map(([e,items])=>`<div class="panel" style="margin-bottom:12px"><h3>${esc(e)} <span class="pill">${items.length} atendimento(s)</span></h3><div class="table-wrap"><table><thead><tr><th>Data</th><th>Tipo</th><th>Localidade</th><th>Ponto de atendimento</th><th>Unidade</th><th>Status</th></tr></thead><tbody>${items.map(x=>`<tr><td>${progData(x.data)}</td><td>${esc(nomeTipoAtendimentoProg(x))}</td><td>${esc(x.localidade)}</td><td>${esc(x.pontoAtendimento||'-')}</td><td>${esc(x.unidade||'-')}</td><td><span class="pill ${progStatusClass(x.status||'Programado')}">${esc(x.status||'Programado')}</span></td></tr>`).join('')}</tbody></table></div></div>`).join('')||'<div class="panel muted">Nenhum atendimento encontrado para os filtros selecionados.</div>';document.getElementById('relResultado').innerHTML=html;window._mmsRelatorio=arr}
function imprimirRelatorioMensal(){
 const arr=Array.isArray(window._mmsRelatorio)?window._mmsRelatorio:[];
 if(!arr.length)return alert('Gere o relatório mensal antes de imprimir.');
 const linhas=arr.map(x=>`<tr><td>${esc(progData(x.data))}</td><td>${esc(x.empresa||'')}</td><td>${esc(nomeTipoAtendimentoProg(x))}</td><td>${esc(x.localidade||'')}</td><td>${esc(x.pontoAtendimento||'-')}</td><td>${esc(x.unidade||'-')}</td><td>${esc(x.status||'')}</td></tr>`).join('');
 const html=`<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Relatório mensal MMS</title><style>body{font:12px Arial,sans-serif;color:#172033!important;background:#fff;margin:0;padding:24px}header{border-bottom:3px solid #08a9dc;padding-bottom:12px;margin-bottom:18px}h1{font-size:20px;color:#403b88!important;margin:0}h2{font-size:16px;color:#172033!important;margin:8px 0}p{color:#172033!important}table{border-collapse:collapse;width:100%;font-size:11px;color:#172033!important}th,td{border:1px solid #9aa4b2;padding:7px;text-align:left;vertical-align:top;color:#172033!important;background:#fff!important}th{background:#eaf2f7!important;color:#172033!important}tbody tr:nth-child(even) td{background:#f5f7fa!important;color:#172033!important}@page{size:landscape;margin:12mm}@media print{body{padding:0;-webkit-print-color-adjust:exact;print-color-adjust:exact}}</style></head><body><header><h1>MMS SUPORTE LOGÍSTICA</h1><h2>Relatório mensal de atendimentos</h2><p>Registros: ${arr.length} · Gerado em ${esc(new Date().toLocaleString('pt-BR'))}</p></header><table><thead><tr><th>Data</th><th>Empresa</th><th>Tipo</th><th>Localidade</th><th>Ponto de atendimento</th><th>Unidade</th><th>Status</th></tr></thead><tbody>${linhas}</tbody></table><script>window.onload=()=>window.print()<\/script></body></html>`;
 const w=window.open('','_blank');if(!w)return alert('Permita a abertura de janelas para gerar o PDF.');w.document.open();w.document.write(html);w.document.close();
}

function medicoes(){
 if(!isCoordinator()){alert('A ferramenta Medições é exclusiva da coordenação MMS.');return home()}
 state.page='medicoes';
 const cards=[['dof13','DOF Frota 1 e 3','🚢','Medição dos atendimentos confirmados da frota DOF 1 e 3.'],['tfmcDof2','TFMC / DOF Frota 2','🛠️','Medição dos atendimentos confirmados de TFMC e DOF Frota 2.'],['constellation','Constellation','⚓','Medição dos atendimentos confirmados da Constellation.'],['transporte','Transporte','🚐','Deslocamentos com saída de hotel até 07h59.'],['importarWhatsApp','Importar programação do WhatsApp','📋','Cole a mensagem da programação, revise as linhas e copie para a tabela de transporte.']];
 shell(`${pageTitle('Medições','Gere as tabelas de medição a partir dos atendimentos cadastrados na Programação')}<div class="notice">As medições de DOF, TFMC/DOF e Constellation consideram somente programações com status <b>Confirmado</b>. Transporte considera programações não canceladas com saída de hotel até <b>07h59</b>, inclusive. Os dados vêm diretamente da Programação e não alteram os registros originais.</div><div class="grid">${cards.map(([id,nome,ico,desc])=>`<button class="tile medicao-tile" onclick="${id==='importarWhatsApp'?'abrirImportacaoWhatsApp()':`abrirMedicao('${id}')`}"><span class="arrow">↗</span><div class="ico">${ico}</div><h3>${esc(nome)}</h3><p>${esc(desc)}</p></button>`).join('')}</div>`);

function notaRegrasMedicao(tipo){if(tipo==='constellation')return 'Mapeamento automático: VOO = Horário da TT; Triagem = Início do atendimento; Check-in = Término do atendimento. A coluna Preposto em Atend. usa 1 como padrão.';if(tipo==='transporte')return 'Considera programações não canceladas. Origem fixa: RESIDÊNCIA. Destino: hotel cadastrado. Entram horários até 07:59, inclusive; 08:00 ou posterior fica fora. TFMC/DOF pode gerar uma linha por hotel/saída.';return 'Somente status Confirmado. A coluna Preposto em Atend. usa 1 como padrão, pois o cadastro atual possui um preposto por atendimento. Para aeroportos, quando não existe AT, o Horário usa VOO e depois Check-in.'}
function dataMesInicioMedicao(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-01`}
function dataMesFimMedicao(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(new Date(d.getFullYear(),d.getMonth()+1,0).getDate()).padStart(2,'0')}`}
function localidadesDisponiveisMedicao(){
 return ['Rio de Janeiro','Macaé','Vitória','Maricá','Farol de São Tomé','Cabo Frio','Campos'];
}
function atualizarTodasLocalidadesMedicao(){
 const caixas=[...document.querySelectorAll('[data-medicao-local]')],todas=document.getElementById('medicaoTodasLocais');
 if(!todas)return;
 const marcadas=caixas.filter(c=>c.checked).length;
 todas.checked=caixas.length>0&&marcadas===caixas.length;
 todas.indeterminate=marcadas>0&&marcadas<caixas.length;
}
function marcarTodasLocalidadesMedicao(marcar){
 document.querySelectorAll('[data-medicao-local]').forEach(c=>{c.checked=!!marcar});
 atualizarTodasLocalidadesMedicao();
}
function localidadesSelecionadasMedicao(){return [...document.querySelectorAll('[data-medicao-local]:checked')].map(c=>c.value)}
function abrirMedicao(tipo){
 if(!isCoordinator())return alert('A ferramenta Medições é exclusiva da coordenação MMS.');
 const cfg=MEDICOES_CONFIG[tipo];if(!cfg)return medicoes();state.medicaoTipo=tipo;state.medicaoResultado=null;

function normalizarTextoMedicao(v){return String(v||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim().toUpperCase().replace(/\s+/g,' ')}
function dataValidaMedicao(x,inicio,fim){return !!x.data&&x.data>=inicio&&x.data<=fim}
function horaMinutosMedicao(valor){
 const s=String(valor||'').trim().toUpperCase().replace(/\s/g,'').replace(/HRS?$/,'');
 const m=s.match(/^(\d{1,2})[:H.](\d{2})$/);if(!m)return null;
 const h=Number(m[1]),min=Number(m[2]);if(h<0||h>23||min<0||min>59)return null;return h*60+min;
}
function horarioPrincipalMedicao(x){
 if(x.atendimento)return x.atendimento;
 if(x.tipo==='aeroporto')return x.voo||x.checkin||'';
 return x.voo||x.checkin||x.triagem||'';
}
function tipoPlanilhaMedicao(x){
 const map={aeroporto:'Troca de turma',porto:'Troca de turma',estaleiro:'Troca de turma',aso:'Aso',medvac:'MedVac',beneficios:'Benefícios',constellation:'Troca de turma'};
 return map[x.tipo]||x.tipoNome||x.tipo||'';
}
function baseConfirmadosMedicao(inicio,fim){return getProgramacoes().filter(x=>normalizarTextoMedicao(x.status)==='CONFIRMADO'&&dataValidaMedicao(x,inicio,fim))}
function pontoMedicao(x){return String(x.pontoAtendimento||x.localidade||'').trim()}
function qtdPrepostosMedicao(x){return String(x.qtdPrepostos||x.prepostosEmAtend||'1')}
function construirLinhasMedicao(tipo,inicio,fim,localidadesSelecionadas=null){
 const incluirLocal=x=>!Array.isArray(localidadesSelecionadas)||localidadesSelecionadas.includes(x.localidade);
 const confirmados=baseConfirmadosMedicao(inicio,fim).filter(incluirLocal);
 let rows=[];
 if(tipo==='dof13'){
  const itens=confirmados.filter(x=>normalizarTextoMedicao(x.empresa)==='DOF FROTA 1 E 3').sort(ordenarDataHorarioMedicao);
  rows=itens.map((x,i)=>({numero:i+1,data:progData(x.data),unidade:x.unidade||'',horario:horarioPrincipalMedicao(x),empresa:'DOF',qtd:qtdPrepostosMedicao(x),preposto:x.preposto||'',local:pontoMedicao(x),obs:x.observacoes||''}));
 }else if(tipo==='tfmcDof2'){
  const empresas=['TFMC','TFMC/DOF','DOF FROTA 2'];
  const itens=confirmados.filter(x=>empresas.includes(normalizarTextoMedicao(x.empresa))).sort(ordenarDataHorarioMedicao);
  rows=itens.map((x,i)=>({numero:i+1,data:progData(x.data),unidade:x.unidade||'',tipo:tipoPlanilhaMedicao(x),horario:horarioPrincipalMedicao(x),empresa:x.empresa||'',qtd:qtdPrepostosMedicao(x),preposto:x.preposto||'',local:pontoMedicao(x),obs:x.observacoes||''}));
 }else if(tipo==='constellation'){
  const itens=confirmados.filter(x=>normalizarTextoMedicao(x.empresa)==='CONSTELLATION'||x.tipo==='constellation').sort(ordenarDataHorarioMedicao);
  rows=itens.map((x,i)=>({numero:i+1,data:progData(x.data),unidade:x.unidade||'',horarioTT:x.voo||'',inicio:x.triagem||'',fim:x.checkin||'',qtd:qtdPrepostosMedicao(x),preposto:x.preposto||'',local:pontoMedicao(x)}));
 }else if(tipo==='transporte'){
  const candidatos=getProgramacoes().filter(x=>normalizarTextoMedicao(x.status)!=='CANCELADO'&&dataValidaMedicao(x,inicio,fim)&&incluirLocal(x)).sort(ordenarDataHorarioMedicao);
  candidatos.forEach(x=>{
   const opcoes=empresaTfmcDofProg(x.empresa)
    ? [{empresa:'DOF',hotel:x.hotelDOF||x.hotel,saida:x.saidaDOF||x.saida},{empresa:'TFMC',hotel:x.hotelTFMC,saida:x.saidaTFMC}]
    : [{empresa:x.empresa||'',hotel:x.hotel,saida:x.saida}];
   opcoes.forEach(op=>{
    const mins=horaMinutosMedicao(op.saida);const hotel=String(op.hotel||'').trim();
    if(mins===null||mins>479||!hotel||normalizarTextoMedicao(hotel)==='N/A')return;
    rows.push({data:progData(x.data),diaSemana:diaSemanaMedicao(x.data),horario:String(op.saida).trim(),preposto:x.preposto||'',origem:'RESIDÊNCIA',destino:hotel,empresa:op.empresa,embarcacao:x.unidade||'',localAtendimento:pontoMedicao(x),obs:x.observacoes||''});
   });
  });
  rows.sort((a,b)=>{const da=normalizarDataBrMedicao(a.data),dbb=normalizarDataBrMedicao(b.data);return da.localeCompare(dbb)||((horaMinutosMedicao(a.horario)??0)-(horaMinutosMedicao(b.horario)??0))});
 }
 return rows;
}
function ordenarDataHorarioMedicao(a,b){return String(a.data||'').localeCompare(String(b.data||''))||(horaMinutosMedicao(horarioPrincipalMedicao(a))??0)-(horaMinutosMedicao(horarioPrincipalMedicao(b))??0)}
function normalizarDataBrMedicao(s){const m=String(s||'').match(/^(\d{2})\/(\d{2})\/(\d{4})$/);return m?`${m[3]}-${m[2]}-${m[1]}`:String(s||'')}
function diaSemanaMedicao(data){const [y,m,d]=String(data||'').split('-').map(Number);if(!y||!m||!d)return '';return new Intl.DateTimeFormat('pt-BR',{weekday:'long'}).format(new Date(y,m-1,d,12,0,0))}
function gerarMedicao(tipo){

}

function limparTextoImportacaoWhatsAppLinha(v){
 return String(v||'').replace(/[\u200e\u200f\u202a-\u202e\ufeff]/g,'').replace(/^[\s>]+/,'').replace(/[*_`~]/g,'').trim();
}
function normalizarChaveImportacaoWhatsApp(v){return normalizarTextoMedicao(String(v||'').replace(/[^\p{L}\p{N}]+/gu,' '));}
function converterDataImportacaoWhatsApp(v){
 const s=String(v||'').trim();let m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
 let ano,mes,dia;
 if(m){dia=Number(m[1]);mes=Number(m[2]);ano=Number(m[3]);}
 else{
  m=s.match(/^(\d{4})-(\d{2})-(\d{2})$/);if(!m)return '';
  ano=Number(m[1]);mes=Number(m[2]);dia=Number(m[3]);
 }
 const d=new Date(Date.UTC(ano,mes-1,dia));
 if(d.getUTCFullYear()!==ano||d.getUTCMonth()!==mes-1||d.getUTCDate()!==dia)return '';
 return `${ano}-${String(mes).padStart(2,'0')}-${String(dia).padStart(2,'0')}`;
}
function textoCabecalhoImportacaoWhatsApp(v){
 return String(v||'')
  .replace(/[\u{1F300}-\u{1FAFF}\u{2600}-\u{27BF}]/gu,' ')
  .replace(/[\uFE0E\uFE0F]/g,' ')
  .replace(/[|]+/g,' ')
  .replace(/[–—]/g,'-')
  .replace(/^[\s\-•·▪]+|[\s\-•·▪]+$/g,'')
  .replace(/\s*-{2,}\s*/g,' ')
  .replace(/\s+/g,' ').trim();
}
function detectarDataCabecalhoImportacaoWhatsApp(v){
 const s=normalizarTextoMedicao(textoCabecalhoImportacaoWhatsApp(v));
 if(!s)return '';
 const dia='(?:DOMINGO|SEGUNDA(?:\s*-?\s*FEIRA)?|TERCA(?:\s*-?\s*FEIRA)?|QUARTA(?:\s*-?\s*FEIRA)?|QUINTA(?:\s*-?\s*FEIRA)?|SEXTA(?:\s*-?\s*FEIRA)?|SABADO)';
 const padrao=new RegExp(`^(?:${dia}\\s+)?(\\d{1,2}\\/\\d{1,2}\\/\\d{4})(?:\\s+${dia})?$`,'i');
 const padraoIso=new RegExp(`^(?:${dia}\\s+)?(\\d{4}-\\d{2}-\\d{2})(?:\\s+${dia})?$`,'i');
 let m=s.match(padrao)||s.match(padraoIso);
 return m?converterDataImportacaoWhatsApp(m[1]):'';
}
function detectarLocalImportacaoWhatsApp(v){
 const chave=normalizarChaveImportacaoWhatsApp(textoCabecalhoImportacaoWhatsApp(v));
 if(!chave)return '';
 return PROG_LOCAIS.find(l=>{const alvo=normalizarChaveImportacaoWhatsApp(l);return chave===alvo||chave.includes(alvo)})||'';
}
function resolverEmpresaImportacaoWhatsApp(v){
 const n=normalizarChaveImportacaoWhatsApp(v);
 if(!n)return '';
 if(/\bTFMC\s+DOF\b/.test(n)||n==='TFMC DOF')return 'TFMC/DOF';
 if(n==='TFMC DOF FROTA 2'||n==='TFMC/DOF FROTA 2')return 'DOF FROTA 2';
 if(n==='DOF FROTA 1 E 3'||n==='DOF FROTA 1 3')return 'DOF FROTA 1 E 3';
 if(n==='DOF FROTA 2')return 'DOF FROTA 2';
 if(n==='TFMC')return 'TFMC';
 if(n==='DOF')return 'DOF';
 if(n==='SS7'||n==='SUBSEA'||n==='SUBSEA 7')return 'SS7';
 if(n==='CONST'||n==='CONSTELLATION'||n==='CONSTELATION')return 'CONSTELLATION';
 if(n==='GRAN ENERGIA'||n==='GRANENERGIA')return 'GRAN ENERGIA';
 if(n==='MCDERMOTT'||n==='MACDERMOTT')return 'MCDERMOTT';
 return '';
}
function limparUnidadeImportacaoWhatsApp(v){
 const unidade=textoCabecalhoImportacaoWhatsApp(String(v||'').replace(/\([^)]*\)/g,' '))
  .replace(/^[:\-–—\s]+|[:\-–—\s]+$/g,'').trim().toUpperCase();
 // Em mensagens da Subsea, “7RIO” e “7MERLIN” representam “SEVEN RIO” e “SEVEN MERLIN”.
 return unidade.replace(/^7\s*(?=[A-Z])/,'SEVEN ');
}
function identificarCabecalhoOperacaoWhatsApp(linha){
 const s=textoCabecalhoImportacaoWhatsApp(linha);if(!s)return null;
 // Formato: SS7: SEVEN MERLIN (OMNI) ou CONST.: BRAVA STAR
 const colon=s.indexOf(':');
 if(colon>0){
  const esquerda=s.slice(0,colon).trim(),direita=s.slice(colon+1).trim(),empresa=resolverEmpresaImportacaoWhatsApp(esquerda);
  if(empresa&&direita)return {empresa,unidade:limparUnidadeImportacaoWhatsApp(direita)};
 }
 // Formatos com hífen dos dois lados: SUBSEA - 7RIO ou CDA - TFMC
 const partes=s.split(/\s+-\s+/).map(x=>x.trim()).filter(Boolean);
 if(partes.length===2){
  const empEsq=resolverEmpresaImportacaoWhatsApp(partes[0]),empDir=resolverEmpresaImportacaoWhatsApp(partes[1]);
  if(empEsq&&!empDir)return {empresa:empEsq,unidade:limparUnidadeImportacaoWhatsApp(partes[1])};
  if(empDir&&!empEsq)return {empresa:empDir,unidade:limparUnidadeImportacaoWhatsApp(partes[0])};
 }
 return null;
}
function extrairCampoRotuladoImportacaoWhatsApp(linha){

  [/^empresa\s*:\s*(.*)$/i,'empresa'],

  [/^ponto\s+de\s+atendimento\s*:\s*(.*)$/i,'pontoAtendimento'],

  [/^(?:hotel\s+dof|dof\s*[-–]\s*ponto\s+de\s+in[ií]cio)\s*:\s*(.*)$/i,'hotelDOF'],
  [/^sa[ií]da\s+(?:do\s+hotel\s+)?dof\s*:\s*(.*)$/i,'saidaDOF'],
  [/^(?:hotel\s+tfmc|tfmc\s*[-–]\s*ponto\s+de\s+in[ií]cio)\s*:\s*(.*)$/i,'hotelTFMC'],
  [/^sa[ií]da\s+(?:do\s+hotel\s+)?tfmc\s*:\s*(.*)$/i,'saidaTFMC'],
  [/^sa[ií]da\s+do\s+hotel\s*:\s*(.*)$/i,'saida'],
  [/^(?:hotel|ponto\s+de\s+in[ií]cio)\s*:\s*(.*)$/i,'hotel'],
  [/^sa[ií]da\s*:\s*(.*)$/i,'saida'],
  [/^check[\s-]?in\s*:?\s*(.*)$/i,'checkin'],
  [/^v[oô]o\s*:?\s*(.*)$/i,'voo'],
  [/^triagem\s*:?\s*(.*)$/i,'triagem'],
  [/^atendimento\s*:?\s*(.*)$/i,'atendimento'],
  [/^at\s*:\s*(.*)$/i,'atendimento'],
  [/^preposto\s*:\s*(.*)$/i,'preposto'],
  [/^telefone\s*:\s*(.*)$/i,'telefone'],
  [/^obs(?:ervacoes|ervacao)?\s*:\s*(.*)$/i,'observacoes'],
  [/^observa(?:ç|c)(?:õ|o)es?\s*:\s*(.*)$/i,'observacoes'],
  [/^data\s*:\s*(.*)$/i,'data']
 ];
 for(const [re,campo] of patterns){const m=s.match(re);if(m)return {campo,valor:(m[1]||'').trim()};}

function extrairHorarioEComplementoImportacaoWhatsApp(v){
 const s=String(v||'').trim();
 const m=s.match(/(?:^|\b)(\d{1,2})\s*(?:(h)\s*(\d{0,2})|:\s*(\d{2}))(?:\s*(?:hrs?|horas?))?(?!\d)/i);
 if(!m)return {horario:'',complemento:''};
 const hora=Number(m[1]),minuto=Number(m[3]||m[4]||0);
 if(hora>23||minuto>59)return {horario:'',complemento:''};
 const horario=String(hora).padStart(2,'0')+':'+String(minuto).padStart(2,'0');
 const complemento=(s.slice(0,m.index)+s.slice(m.index+m[0].length)).replace(/^[\s:;,\-–—]+|[\s:;,\-–—]+$/g,'').trim();
 return {horario,complemento};
}
function subtrairHorarioImportacaoWhatsApp(horario,minutos){
 const m=String(horario||'').match(/^(\d{2}):(\d{2})$/);if(!m)return '';
 let total=Number(m[1])*60+Number(m[2])-minutos;total=(total%(24*60)+(24*60))%(24*60);
 return String(Math.floor(total/60)).padStart(2,'0')+':'+String(total%60).padStart(2,'0');
}
function adicionarObsImportacaoWhatsApp(registro,texto){
 const s=String(texto||'').trim();if(!s)return;
 const atual=String(registro.observacoes||'').trim();
 if(!atual)registro.observacoes=s;else if(!atual.split('\n').some(x=>x.toLowerCase()===s.toLowerCase()))registro.observacoes=atual+'\n'+s;
}
function nomePrepostoEmFraseImportacaoWhatsApp(linha){
 const s=String(linha||'').trim();
 let m=s.match(/^\(?\s*([\p{L}][\p{L} .'-]{1,40}?)\s*\)?\s+(?:far[áa]|vai|realizar[áa])\s+(?:o\s+)?atendimento!?\s*$/iu);
 if(!m)return '';
 const nome=m[1].replace(/[()]/g,'').trim().replace(/\s+/g,' ');
 if(/^(folga|beneficios?|atendimento)$/i.test(nome))return '';
 return nome.toUpperCase();
}
function analisarTextoProgramacaoWhatsApp(texto,dataPadrao=''){
 const linhas=String(texto||'').replace(/\r/g,'').split('\n');
 let dataAtual=converterDataImportacaoWhatsApp(dataPadrao)||'',localAtual='',atual=null,ultimoCampo='',registros=[];
 const fechar=()=>{
  if(atual){
   atual.data=atual.data||dataAtual;atual.localidade=atual.localidade||localAtual;
   if(atual.unidade||atual.empresa||atual.preposto||atual.checkin||atual.saida||atual.hotel||atual.pontoAtendimento)registros.push(atual);
   atual=null;ultimoCampo='';
  }
 };
 linhas.forEach(raw=>{
  const linha=limparTextoImportacaoWhatsAppLinha(raw);if(!linha)return;
  // Cabeçalho de data com emojis e dia da semana: DOMINGO 01/11/2026 📌 ou 📌03/11/2026 terça-feira📌.
  // Só aceita a linha quando ela contém essencialmente a data e o dia da semana, para não confundir com observações.
  if(!/^data\s*:/i.test(linha)){
   const dataCabecalho=detectarDataCabecalhoImportacaoWhatsApp(linha);
   if(dataCabecalho){fechar();dataAtual=dataCabecalho;localAtual='';return;}
  }
  // Faixa de localidade com emojis, bandeiras ou traços decorativos.
  if(!linha.includes(':')){
   const localConhecido=detectarLocalImportacaoWhatsApp(linha);
   if(localConhecido){fechar();localAtual=localConhecido;return;}
  }
  // Expressões livres de preposto: "ITALO fará o atendimento!" ou "(Douglas) fará...".
  const prepostoFrase=nomePrepostoEmFraseImportacaoWhatsApp(linha);
  if(prepostoFrase){if(!atual)atual={data:dataAtual,localidade:localAtual};atual.preposto=prepostoFrase;ultimoCampo='preposto';return;}
  // Marcador de folga encerra o atendimento anterior e não cria registro.
  if(/^folga\b/i.test(textoCabecalhoImportacaoWhatsApp(linha))){fechar();return;}
  // Linha de local entre parênteses, como (Aerocabo), é o ponto de atendimento.
  const localParentetico=linha.match(/^\(\s*([^()]{2,60})\s*\)$/);
  if(localParentetico&&atual){atual.pontoAtendimento=textoCabecalhoImportacaoWhatsApp(localParentetico[1]).toUpperCase();ultimoCampo='pontoAtendimento';return;}
  // Campos nomeados, com ou sem dois-pontos conforme o padrão do cliente.
  const campoInfo=extrairCampoRotuladoImportacaoWhatsApp(linha);
  if(campoInfo){
   const {campo}=campoInfo;let valor=campoInfo.valor;
   if(campo==='data'){
    const d=converterDataImportacaoWhatsApp(valor);if(d){if(atual)atual.data=d;else dataAtual=d;}return;
   }
   if(campo==='localidade'){localAtual=valor||localAtual;if(atual)atual.localidade=localAtual;return;}
   if(campo==='unidade'&&atual&&(atual.unidade||atual.empresa||atual.preposto))fechar();
   if(!atual)atual={data:dataAtual,localidade:localAtual};
   if(campo==='saida'||campo==='saidaDOF'||campo==='saidaTFMC'){
    const {horario,complemento}=extrairHorarioEComplementoImportacaoWhatsApp(valor);
    atual[campo]=horario;
    if(complemento&&!atual.hotel)atual.hotel=complemento.toUpperCase();
    if(!horario&&valor)adicionarObsImportacaoWhatsApp(atual,'Saída: '+valor);
   }else if(campo==='triagem'){
    atual.triagem=valor;if(valor&&/verificar|confirmar|consultar|e-?mail/i.test(valor))adicionarObsImportacaoWhatsApp(atual,'Triagem: '+valor);
   }else if(campo==='checkin'||campo==='voo'){
    const parsed=extrairHorarioEComplementoImportacaoWhatsApp(valor);atual[campo]=parsed.horario||valor;
    if(parsed.complemento)adicionarObsImportacaoWhatsApp(atual,campo.toUpperCase()+': '+parsed.complemento);
   }else{
    atual[campo]=valor;
   }
   ultimoCampo=campo;return;
  }
  // Cabeçalhos não padronizados: "SS7: SEVEN MERLIN (OMNI)", "SUBSEA - 7RIO", "CDA - TFMC".
  const cabecalho=identificarCabecalhoOperacaoWhatsApp(linha);
  if(cabecalho&&cabecalho.unidade){
   fechar();atual={data:dataAtual,localidade:localAtual,empresa:cabecalho.empresa,unidade:cabecalho.unidade};ultimoCampo='unidade';return;
  }
  // Linhas livres que complementam o atendimento atual viram observação.
  if(atual){
   const txt=textoCabecalhoImportacaoWhatsApp(linha);
   if(txt&&txt.length>2)adicionarObsImportacaoWhatsApp(atual,txt);
  }
 });
 fechar();
 return registros.filter(r=>Object.keys(r).some(k=>!['data','localidade'].includes(k)));
}
function valorImportacaoWhatsApp(v){const s=String(v??'').trim();return s||'N/A';}
function expandirRegistrosImportacaoWhatsApp(registros){
 const rows=[];
 registros.forEach((r,idx)=>{
  const empresa=String(r.empresa||'').trim(),empresaNorm=normalizarTextoMedicao(empresa);
  const pares=[];
  const dofHotel=r.hotelDOF||'',dofSaida=r.saidaDOF||'',tfmcHotel=r.hotelTFMC||'',tfmcSaida=r.saidaTFMC||'';
  const temEspecifico=[dofHotel,dofSaida,tfmcHotel,tfmcSaida].some(v=>String(v||'').trim()&&normalizarTextoMedicao(v)!=='N/A');
  if(temEspecifico){
   if([dofHotel,dofSaida].some(v=>String(v||'').trim()&&normalizarTextoMedicao(v)!=='N/A'))pares.push({empresa:'DOF',hotel:dofHotel,saida:dofSaida});
   if([tfmcHotel,tfmcSaida].some(v=>String(v||'').trim()&&normalizarTextoMedicao(v)!=='N/A'))pares.push({empresa:'TFMC',hotel:tfmcHotel,saida:tfmcSaida});
  }
  if(!pares.length)pares.push({empresa,hotel:r.hotel||'',saida:r.saida||''});
  pares.forEach((op,leg)=>{
   const data=r.data||'';
   const parsedSaida=extrairHorarioEComplementoImportacaoWhatsApp(op.saida||'');
   let horario=parsedSaida.horario;
   const empresaLinha=String(op.empresa||empresa).trim();
   const empresaNormalizada=normalizarTextoMedicao(empresaLinha);
   if(!horario){
    const check=extrairHorarioEComplementoImportacaoWhatsApp(r.checkin||'').horario;
    if(check&&(/^(SS7|SUBSEA|SUBSEA 7)$/.test(empresaNormalizada)||empresaNormalizada.includes('SUBSEA')))horario=subtrairHorarioImportacaoWhatsApp(check,60);
    else if(check&&(/CONSTELLATION|^CONST$/.test(empresaNormalizada)))horario=subtrairHorarioImportacaoWhatsApp(check,90);
   }
   const destino=op.hotel||r.hotel||parsedSaida.complemento||'';
   rows.push({id:`${idx}-${leg}`,selected:true,data:data?progData(data):'N/A',diaSemana:data?diaSemanaMedicao(data):'N/A',horario:valorImportacaoWhatsApp(horario),preposto:valorImportacaoWhatsApp(r.preposto),origem:'RESIDÊNCIA',destino:valorImportacaoWhatsApp(destino),empresa:valorImportacaoWhatsApp(op.empresa),embarcacao:valorImportacaoWhatsApp(r.unidade),localAtendimento:valorImportacaoWhatsApp(r.pontoAtendimento||r.localidade),obs:valorImportacaoWhatsApp(r.observacoes),localidade:r.localidade||'',sourceIndex:idx});
  });
 });
 return rows;
}

function mmsQuality(){if(!qualityCanOpen())return home();state.page='quality';let total=getQualityResponses().length;let url=qualityPublicUrl();shell(`<div style="margin-bottom:14px"><button class="back" onclick="go('home')">← Voltar ao painel principal</button></div><section class="quality-hero"><div class="eyebrow">MMS SUPORTE LOGÍSTICA · EXPERIÊNCIA DO CLIENTE</div><h2>MMS Quality</h2><p>Central de gestão da qualidade dos atendimentos. Receba avaliações pelo mesmo link fixo e acompanhe a experiência dos clientes por empresa, localidade e preposto.</p></section><div class="panel" style="margin-bottom:16px"><div class="section-head" style="margin:0 0 12px"><div><h2>Link fixo de avaliação</h2><p>Um único endereço para incluir no rodapé dos e-mails de programação de todos os clientes.</p></div><badge class="pill approved">Endereço permanente</badge></div><div class="form-grid" style="align-items:center"><div><div class="quality-link"><input id="qualityPublicLink" readonly value="${esc(url)}"><button class="btn primary" onclick="copyQualityLink()">Copiar link</button><button class="btn secondary" onclick="openQualityPublic()">Abrir formulário</button></div><div class="toolbar"><button class="btn outline small" onclick="copyQualityFooter()">Copiar texto para rodapé do e-mail</button><button class="btn outline small" onclick="downloadQualityQR()">Baixar QR Code</button></div><div class="notice" style="margin:0">O link usa o endereço onde este aplicativo estiver hospedado. Antes de encaminhar aos clientes, publique o aplicativo em um domínio HTTPS. Nesta versão demonstrativa, as respostas ficam no navegador que recebeu o envio; para reunir avaliações feitas por dispositivos externos no painel da coordenação, é obrigatória a integração com banco de dados compartilhado.</div></div><div style="display:flex;justify-content:center"><div id="qualityQr" class="quality-qr"><span class="muted" style="font-size:11px;text-align:center">Gerando QR Code...</span></div></div></div></div><div class="quality-kpis"><div class="quality-kpi"><small>AVALIAÇÕES RECEBIDAS</small><strong id="qKpiTotal">${total}</strong></div><div class="quality-kpi"><small>SATISFAÇÃO MÉDIA</small><strong id="qKpiAverage">${total?(getQualityResponses().reduce((a,x)=>a+(Number(x.media)||0),0)/total).toFixed(1).replace('.',','):'—'}</strong></div><div class="quality-kpi"><small>RECLAMAÇÕES</small><strong id="qKpiComplaints">${getQualityResponses().filter(x=>x.categoria==='Reclamação').length}</strong></div><div class="quality-kpi"><small>OCORRÊNCIAS</small><strong id="qKpiIncidents">${getQualityResponses().filter(x=>x.categoria==='Ocorrência').length}</strong></div></div><div class="panel"><div class="section-head" style="margin:0 0 12px"><div><h2>Filtros gerenciais</h2><p>Analise os resultados por período, cliente, localidade e preposto.</p></div></div><div class="form-grid"><div class="field"><label>De</label><input type="date" id="qFilterFrom" onchange="renderQualityResults()"></div><div class="field"><label>Até</label><input type="date" id="qFilterTo" onchange="renderQualityResults()"></div><div class="field"><label>Empresa</label><select id="qFilterCompany" onchange="renderQualityResults()"><option value="">Todas</option>${PROG_EMPRESAS.map(e=>`<option>${esc(e)}</option>`).join('')}</select></div><div class="field"><label>Localidade</label><select id="qFilterLocal" onchange="renderQualityResults()"><option value="">Todas</option>${PROG_LOCAIS.map(l=>`<option>${esc(l)}</option>`).join('')}</select></div><div class="field"><label>Preposto</label><input id="qFilterPreposto" placeholder="Nome do preposto" oninput="renderQualityResults()"></div><div class="field"><label>Categoria</label><select id="qFilterCategory" onchange="renderQualityResults()"><option value="">Todas</option>${QUALITY_CATEGORIAS.map(c=>`<option>${c}</option>`).join('')}</select></div></div><div class="toolbar"><button class="btn secondary" onclick="clearQualityFilters()">Limpar filtros</button><button c function qualityFiltered(){let list=getQualityResponses().slice().sort((a,b)=>(b.submittedAt||'').localeCompare(a.submittedAt||''));let from=document.getElementById('qFilterFrom')?.value||'',to=document.getElementById('qFilterTo')?.value||'',co=document.getElementById('qFilterCompany')?.value||'',loc=document.getElementById('qFilterLocal')?.value||'',pre=(document.getElementById('qFilterPreposto')?.value||'').trim().toLowerCase(),cat=document.getElementById('qFilterCategory')?.value||'';return list.filter(x=>(!from||(x.dataAtendimento||'')>=from)&&(!to||(x.dataAtendimento||'')<=to)&&(!co||x.empresa===co)&&(!loc||x.localidade===loc)&&(!pre||(x.preposto||'').toLowerCase().includes(pre))&&(!cat||x.categoria===cat))}

dius:9px;padding:8px;font-size:11px"><b>${esc(l)}:</b> ${Number(x.ratings?.[k]||0)}/5</div>`).join('')}</div>${x.comentario?`<p><b>Comentário:</b> ${esc(x.comentario)}</p>`:''}${x.desejaContato?`<p><b>Solicitou contato:</b> Sim · ${esc(x.contato||'')}</p>`:''}</article>`).join('')}

function fmtValorReembolso(v){let n=Number(v);return Number.isFinite(n)&&n>0?n.toLocaleString('pt-BR',{style:'currency',currency:'BRL'}):'Valor não informado'}
function valorReembolsoValido(x){let n=Number(x?.valor);return Number.isFinite(n)&&n>0?n:0}
function statusPagamentoReembolso(x){if(x?.paymentStatus==='Pago')return 'Pago';if(x?.status==='Não aprovada')return 'Não aprovado';return 'Pendente'}
function reembolsoPendentePagamento(x){return statusPagamentoReembolso(x)==='Pendente'}
function reembolsosSolicitacao(){return getSolicitacoes().filter(x=>x.tipo==='Reembolso')}
function totalReembolsos(lista){return lista.reduce((s,x)=>s+valorReembolsoValido(x),0)}
function solicitacoes(){
 state.page='solicitacoes';
 const admin=isCoordinator(),lista=getSolicitacoes().slice().sort((a,b)=>(b.createdAt||'').localeCompare(a.createdAt||''));
 const minhas=admin?lista:lista.filter(x=>(x.requesterEmail||'').toLowerCase()===(state.user?.email||'').toLowerCase());
 const reemb=admin?lista.filter(x=>x.tipo==='Reembolso'):minhas.filter(x=>x.tipo==='Reembolso');
 const pontos=admin?lista.filter(x=>x.tipo!=='Reembolso'):minhas.filter(x=>x.tipo!=='Reembolso');
 const active=state.solicitacoesView==='ponto'?'ponto':'reembolso';
 const selecionadas=active==='reembolso'?reemb:pontos;
 const pendReemb=reemb.filter(reembolsoPendentePagamento).length;
 const pendPonto=pontos.filter(x=>!['Concluída','Não aprovada'].includes(x.status)).length;
 const tipoTitle=active==='reembolso'?(admin?'Caixa de entrada — Reembolsos':'Meus reembolsos'):(admin?'Caixa de entrada — Ajustes de ponto':'Meus ajustes de ponto');
 const listHtml=selecionadas.length?`<div class="request-list">${selecionadas.map(x=>renderSolicitacaoCard(x,admin)).join('')}</div>`:`<div class="panel muted">${active==='reembolso'?(admin?'Nenhuma solicitação de reembolso recebida.':'Você ainda não enviou solicitações de reembolso.'):(admin?'Nenhuma solicitação de ajuste de ponto recebida.':'Você ainda não enviou solicitações de ajuste de ponto.')}</div>`;
 const navCards=`<div class="request-type-grid">
  <button class="tile request-nav-tile" onclick="novaSolicitacao('reembolso')"><span class="arrow">↗</span><div class="ico">💳</div><h3>Solicitação de reembolso</h3><p>Informe favorecido, PIX, valor, motivo e comprovante.</p></button>
  <button class="tile request-nav-tile" onclick="novaSolicitacao('ponto')"><span class="arrow">↗</span><div class="ico">🕒</div><h3>Solicitação de ajuste de ponto</h3><p>Informe os horários e justifique a necessidade do ajuste.</p></button>
  <button class="tile request-nav-tile ${active==='reembolso'?'is-active':''}" onclick="abrirCaixaSolicitacoes('reembolso')"><span class="arrow">↗</span><div class="ico">📥</div><h3>${admin?'Reembolsos recebidos':'Meus reembolsos'}</h3><p>${admin?'Consulte e controle os reembolsos enviados por toda a equipe.':'Acompanhe somente os reembolsos que você enviou.'}</p><span class="request-nav-count">${reemb.length} registro(s) · ${pendReemb} pendente(s)</span></button>
  <button class="tile request-nav-tile ${active==='ponto'?'is-active':''}" onclick="abrirCaixaSolicitacoes('ponto')"><span class="arrow">↗</span><div class="ico">🗂️</div><h3>${admin?'Ajustes de ponto recebidos':'Meus ajustes de ponto'}</h3><p>${admin?'Caixa de entrada exclusiva dos pedidos de ajuste de ponto da equipe.':'Acompanhe somente os pedidos de ajuste de ponto que você enviou.'}</p><span class="request-nav-count">${pontos.length} registro(s) · ${pendPonto} pendente(s)</span></button>
 </div>`;
 const financial=admin&&active==='reembolso'?renderPainelFinanceiroReembolsos():'';
 const adminNote=admin?`<div class="notice" style="margin-bottom:14px">Visão da coordenação: esta caixa de entrada reúne as solicitações de todos os colaboradores aprovados, separadas por categoria.</div>`:`<div class="notice" style="margin-bottom:14px">Você visualiza somente as suas solicitações. Quando um reembolso for marcado como pago pela coordenação, um aviso aparecerá aqui e no início do aplicativo.</div>`;
 shell(`${pageTitle('Solicitações','Envie pedidos e acompanhe os registros por categoria')}${renderAvisosPagamentoSolicitacoes()}${navCards}<section class="panel"><div class="request-inbox-head"><div><div class="eyebrow">${admin?'Área da coordenação':'Área do colaborador'}</div><h2 style="margin:5px 0 0">${tipoTitle}</h2><p class="muted" style="font-size:12px;margin:5px 0 0">${selecionadas.length} registro(s) nesta categoria</p></div><span class="pill ${selecionadas.some(x=>x.status==='Recebida')?'pending':'approved'}">${selecionadas.filter(x=>x.status==='Recebida').length} aguardando análise</span></div>${adminNote}${financial}${listHtml}</section><div class="notice" style="margin-top:16px">Ambiente demonstrativo: solicitações, comprovantes e avisos ficam salvos neste navegador. Para que os pedidos enviados de outros celulares/computadores cheguem à coordenação e os avisos sejam sincronizados entre dispositivos, será necessária integração com banco de dados compartilhado e armazenamento seguro de anexos.</div>`);
}
function abrirCaixaSolicitacoes(tipo){if(!['reembolso','ponto'].includes(tipo))return;state.solicitacoesView=tipo;solicitacoes();}
function renderAvisosPagamentoSolicitacoes(){
 if(!state.user)return '';
 const avisos=(db().notificacoesSolicitacoes||[]).filter(n=>(n.userEmail||'').toLowerCase()===(state.user.email||'').toLowerCase()&&!n.readAt).sort((a,b)=>(b.createdAt||'').localeCompare(a.createdAt||''));
 if(!avisos.length)return '';
 return `<div class="request-payment-notices">${avisos.map(n=>`<div class="request-payment-notice"><div class="request-meta"><strong>✓ ${esc(n.title||'Reembolso realizado')}</strong><button class="btn outline small" type="button" onclick="marcarAvisoPagamentoLido('${esc(n.id)}')">Entendi</button></div><p>${esc(n.message||'A coordenação confirmou o pagamento do seu reembolso.')}</p><small>${esc(fmtDataHoraSolicitacao(n.createdAt))}</small></div>`).join('')}</div>`;
}
function marcarAvisoPagamentoLido(id){
 if(!state.user)return;
 let d=db();d.notificacoesSolicitacoes=(d.notificacoesSolicitacoes||[]).map(n=>n.id===id&&(n.userEmail||'').toLowerCase()===(state.user.email||'').toLowerCase()?{...n,readAt:new Date().toISOString()}:n);saveDB(d);
 if(state.page==='home')home();else if(state.page==='solicitacoes')solicitacoes();
}
function adicionarAvisoPagamento(d,x,now,origem){
 if(!x.requesterEmail)return;
 d.notificacoesSolicitacoes=Array.isArray(d.notificacoesSolicitacoes)?d.notificacoesSolicitacoes:[];
 d.notificacoesSolicitacoes.push({id:'pay_notice_'+Date.now()+'_'+Math.random().toString(36).slice(2,8),userEmail:x.requesterEmail,requestId:x.id,title:'Reembolso realizado',message:`A coordenação confirmou o pagamento do seu reembolso de ${fmtValorReembolso(x.valor)}. Motivo: ${x.motivo||'Não informado'}.`,createdAt:now,origin:origem||'Coordenação',readAt:null});
}
function renderPainelFinanceiroReembolsos(){
 const reemb=reembolsosSolicitacao(),pend=reemb.filter(reembolsoPendentePagamento),pagos=reemb.filter(x=>statusPagamentoReembolso(x)==='Pago');
 return `<section class="panel" style="margin-bottom:18px"><div class="request-meta"><div><div class="eyebrow">Controle financeiro</div><h2 style="margin:5px 0 0">Reembolsos e pagamentos</h2><p class="muted" style="font-size:12px;margin:5px 0 0">Cada pedido permanece no histórico, mesmo depois de pago.</p></div><span class="request-status em-analise">${pend.length} pendente(s)</span></div><div class="grid" style="margin:14px 0"><div class="request-card"><small class="muted">Total pendente</small><h2 style="margin:5px 0;color:#a05c00">${fmtValorReembolso(totalReembolsos(pend))}</h2><small class="muted">${pend.length} solicitação(ões)</small></div><div class="request-card"><small class="muted">Total pago</small><h2 style="margin:5px 0;color:#16865b">${fmtValorReembolso(totalReembolsos(pagos))}</h2><small class="muted">${pagos.length} solicitação(ões)</small></div></div><div class="form-grid"><div class="field"><label>Quais solicitações incluir no relatório?</label><select id="solRelatorioFiltro"><option value="Pendente">Somente pendentes</option><option value="Pago">Somente pagos</option><option value="Todos">Todas (pendentes e pagos)</option></select></div><div class="field"><label>Relatório consolidado</label><div class="toolbar" style="margin:0"><button class="btn primary" type="button" onclick="copiarRelatorioReembolsos()">Copiar para WhatsApp</button><button class="btn secondary" type="button" onclick="gerarPdfReembolsos()">Gerar PDF</button></div></div></div><div class="toolbar" style="align-items:center"><label style="display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700"><input type="checkbox" id="solSelecionarTodosPendentes" onchange="marcarTodosReembolsos(this.checked)" style="width:17px;height:17px"> Selecionar todos os reembolsos pendentes</label><button class="btn primary small" type="button" onclick="marcarSelecionadosComoPagos()">Marcar selecionados como pagos</button></div><p class="muted" style="font-size:11px;margin:4px 0 0">Os valores pagos saem do total pendente, mas continuam no histórico. O relatório padrão inclui somente valores pendentes.</p></section>`;
}
function novaSolicitacao(tipo){
 state.page='solicitacoes';
 if(tipo==='reembolso'){
  const nome=state.user?.name||'';
  shell(`${pageTitle('Solicitação de reembolso','Informe os dados para pagamento, o valor e o motivo')}<form class="panel" onsubmit="enviarSolicitacaoReembolso(event)"><div class="form-grid"><div class="field"><label>Nome do favorecido *</label><input id="solReembolsoNome" required maxlength="120" value="${esc(nome)}" placeholder="Nome de quem receberá o PIX"></div><div class="field"><label>Chave PIX *</label><input id="solReembolsoPix" required maxlength="180" placeholder="CPF, telefone, e-mail ou chave aleatória"></div><div class="field"><label>Valor solicitado (R$) *</label><input id="solReembolsoValor" type="number" min="0.01" step="0.01" inputmode="decimal" required placeholder="0,00"></div><div class="field full"><label>Motivo da solicitação *</label><textarea id="solReembolsoMotivo" required maxlength="3000" placeholder="Explique detalhadamente o motivo do reembolso e a que despesa ele se refere..."></textarea></div><div class="field full"><label>Comprovante (opcional)</label><input id="solReembolsoArquivo" type="file" accept="application/pdf,image/jpeg,image/png"><small class="muted">Anexe nota fiscal, recibo ou comprovante em PDF, JPG ou PNG. Limite de 2 MB por arquivo.</small></div></div><div class="toolbar"><button class="btn primary" type="submit">Enviar solicitação</button><button class="btn secondary" type="button" onclick="solicitacoes()">Cancelar</button></div></form>`);
 }else{
  shell(`${pageTitle('Solicitação de ajuste de ponto','Informe os horários e explique o motivo da correção')}<form class="panel" onsubmit="enviarSolicitacaoPonto(event)"><div class="form-grid"><div class="field"><label>Horário inicial do atendimento *</label><input id="solPontoInicio" type="time" required></div><div class="field"><label>Horário de encerramento *</label><input id="solPontoFim" type="time" required></div><div class="field full"><label>Observações / justificativa *</label><textarea id="solPontoObs" required maxlength="3000" placeholder="Explique o motivo do ajuste: esquecimento da marcação, falha no aplicativo, instabilidade ou outro motivo..."></textarea></div></div><div class="toolbar"><button class="btn primary" type="submit">Enviar solicitação</button><button class="btn secondary" type="button" onclick="solicitacoes()">Cancelar</button></div></form>`);
 }
}
async function prepararAnexoSolicitacao(file){
 if(!file)return null;
 const tipos=['application/pdf','image/jpeg','image/png'];
 if(!tipos.includes(file.type))throw new Error('Formato não permitido. Utilize PDF, JPG ou PNG.');
 if(file.size>2*1024*1024)throw new Error('O arquivo deve ter no máximo 2 MB.');
 let data=file.type.startsWith('image/')?await compressImage(file,1400,.72):await fileAsDataURL(file);
 return {name:file.name,type:file.type,data,size:file.size};
}
function gravarNovaSolicitacao(item){
 let d=db();d.solicitacoes=d.solicitacoes||[];d.solicitacoes.push(item);
 try{saveDB(d);return true}catch(err){alert('Não foi possível guardar a solicitação. O armazenamento local pode estar cheio; tente um comprovante menor.');return false}
}
async function enviarSolicitacaoReembolso(e){
 e.preventDefault();if(!state.user)return login();
 const nome=document.getElementById('solReembolsoNome').value.trim(),pix=document.getElementById('solReembolsoPix').value.trim(),valor=Number(document.getElementById('solReembolsoValor').value),motivo=document.getElementById('solReembolsoMotivo').value.trim(),file=document.getElementById('solReembolsoArquivo').files[0];let anexo=null;
 if(!nome||!pix||!Number.isFinite(valor)||valor<=0||!motivo)return alert('Preencha nome, chave PIX, valor e motivo do reembolso.');
 try{anexo=await prepararAnexoSolicitacao(file)}catch(err){return alert(err.message)}
 const item={id:'sol_'+Date.now()+'_'+Math.random().toString(36).slice(2,7),tipo:'Reembolso',favorecido:nome,pix,valor:Number(valor.toFixed(2)),motivo,anexo,requesterName:state.user.name,requesterEmail:state.user.email,createdAt:new Date().toISOString(),status:'Recebida',paymentStatus:'Pendente',paymentHistory:[]};
 if(!gravarNovaSolicitacao(item))return;
 alert('Solicitação de reembolso enviada à caixa de entrada da coordenação. O valor ficará registrado como pendente até a confirmação do pagamento.');solicitacoes();
}
function enviarSolicitacaoPonto(e){
 e.preventDefault();if(!state.user)return login();
 const inicio=document.getElementById('solPontoInicio').value,fim=document.getElementById('solPontoFim').value,obs=document.getElementById('solPontoObs').value.trim();
 if(!inicio||!fim||!obs)return alert('Preencha os horários e a justificativa.');
 const item={id:'sol_'+Date.now()+'_'+Math.random().toString(36).slice(2,7),tipo:'Ajuste de ponto',inicio,fim,observacoes:obs,requesterName:state.user.name,requesterEmail:state.user.email,createdAt:new Date().toISOString(),status:'Recebida'};
 if(!gravarNovaSolicitacao(item))return;
 alert('Solicitação de ajuste de ponto enviada à caixa de entrada da coordenação.');solicitacoes();
}
function renderSolicitacaoCard(x,admin){
 const isReembolso=x.tipo==='Reembolso';
 const detalhe=isReembolso?`<b>Favorecido:</b> ${esc(x.favorecido||x.requesterName||'Não informado')}<br><b>PIX:</b> ${esc(x.pix||'Não informado')}<br><b>Valor solicitado:</b> ${esc(fmtValorReembolso(x.valor))}<br><b>Motivo:</b><br>${esc(x.motivo||'')}`:`<b>Horário inicial:</b> ${esc(x.inicio||'—')}<br><b>Horário de encerramento:</b> ${esc(x.fim||'—')}<br><br><b>Justificativa:</b><br>${esc(x.observacoes||'')}`;
 const anexo=x.anexo?`<button class="request-file" type="button" onclick="baixarAnexoSolicitacao('${esc(x.id)}')">📎 ${esc(x.anexo.name)} · Baixar comprovante</button>`:'';
 const payState=isReembolso?statusPagamentoReembolso(x):'';
 const payClass=payState==='Pago'?'concluida':payState==='Não aprovado'?'nao-aprovada':'em-analise';
 const payLabel=payState==='Pago'?'Reembolso pago':payState==='Não aprovado'?'Reembolso não aprovado':'Pagamento pendente';
 const payStatus=isReembolso?`<span class="request-status ${payClass}">${payLabel}</span>`:'';
 const employeePaymentNotice=isReembolso&&!admin&&statusPagamentoReembolso(x)==='Pago'?`<div class="request-payment-notice"><strong>✓ Reembolso realizado</strong><p>A coordenação confirmou o pagamento deste reembolso${x.paidAt?' em '+esc(fmtDataHoraSolicitacao(x.paidAt)):''}.</p></div>`:'';
 const adminControl=admin?`<div class="form-grid" style="margin-top:12px;align-items:end"><div class="field" style="max-width:260px"><label>Atualizar andamento</label><select onchange="atualizarStatusSolicitacao('${esc(x.id)}',this.value)">${SOLICITACAO_STATUS.map(s=>`<option ${x.status===s?'selected':''}>${s}</option>`).join('')}</select></div>${isReembolso&&x.status!=='Não aprovada'?`<div class="field"><label>Controle do pagamento</label><button class="btn ${statusPagamentoReembolso(x)==='Pago'?'secondary':'primary'} small" type="button" onclick="atualizarPagamentoSolicitacao('${esc(x.id)}',${statusPagamentoReembolso(x)==='Pago'?'false':'true'})">${statusPagamentoReembolso(x)==='Pago'?'Reabrir como pendente':'Marcar reembolso como pago'}</button>${x.paidAt?`<small class="muted">Pago em ${esc(fmtDataHoraSolicitacao(x.paidAt))}</small>`:''}</div>`:''}</div>`:'';
 const paymentAudit=isReembolso&&x.paymentHistory?.length?`<div class="request-detail" style="margin-top:8px"><b>Histórico de pagamentos:</b><br>${x.paymentHistory.map(h=>`${esc(h.action)} · ${esc(fmtDataHoraSolicitacao(h.at))} · ${esc(h.by||'Coordenação')}`).join('<br>')}</div>`:'';
 const selectPaid=admin&&isReembolso&&reembolsoPendentePagamento(x)?`<label style="display:flex;gap:7px;align-items:center;margin-top:12px;font-size:12px;font-weight:750"><input type="checkbox" class="sol-reembolso-select" value="${esc(x.id)}" style="width:17px;height:17px"> Selecionar para marcar como pago</label>`:'';
 return `<article class="request-card"><div class="request-meta"><div><span class="pill">${esc(x.tipo)}</span> <span class="request-status ${statusSolicitacaoClass(x.status)}">${esc(x.status||'Recebida')}</span> ${payStatus}</div><small class="muted">${esc(fmtDataHoraSolicitacao(x.createdAt))}</small></div><h3 style="margin-top:10px">${esc(isReembolso?(x.favorecido||x.requesterName||'Colaborador'):x.requesterName||'Colaborador')}</h3><p>${isReembolso?`Solicitado por: ${esc(x.requesterName||'Colaborador')} · `:''}${esc(x.requesterEmail||'')}${isReembolso&&x.valor?` · <strong>${esc(fmtValorReembolso(x.valor))}</strong>`:''}</p><div class="request-detail">${detalhe}</div>${anexo}${selectPaid}${employeePaymentNotice}${adminControl}${paymentAudit}</article>`;
}
function baixarAnexoSolicitacao(id){
 if(!isCoordinator())return alert('Somente a coordenação pode acessar comprovantes anexados.');
 const x=getSolicitacoes().find(s=>s.id===id);if(!x||!x.anexo)return alert('Comprovante não encontrado.');
 const a=document.createElement('a');a.href=x.anexo.data;a.download=x.anexo.name||'comprovante';document.body.appendChild(a);a.click();a.remove();
}
function atualizarStatusSolicitacao(id,status){
 if(!isCoordinator())return alert('Somente a coordenação pode atualizar solicitações.');
 if(!SOLICITACAO_STATUS.includes(status))return alert('Status inválido.');
 let d=db();d.solicitacoes=(d.solicitacoes||[]).map(x=>x.id===id?{...x,status,updatedAt:new Date().toISOString(),updatedBy:state.user.email}:x);saveDB(d);solicitacoes();
}
function atualizarPagamentoSolicitacao(id,pago){
 if(!isCoordinator())return alert('Somente a coordenação pode atualizar pagamentos.');
 const atual=getSolicitacoes().find(x=>x.id===id&&x.tipo==='Reembolso');if(!atual)return alert('Solicitação de reembolso não encontrada.');
 if(pago&&atual.status==='Não aprovada')return alert('Uma solicitação não aprovada não pode ser marcada como paga.');
 if(pago&&statusPagamentoReembolso(atual)==='Pago')return alert('Este reembolso já está marcado como pago.');
 let d=db(),now=new Date().toISOString();
 d.solicitacoes=(d.solicitacoes||[]).map(x=>{if(x.id!==id||x.tipo!=='Reembolso')return x;let hist=Array.isArray(x.paymentHistory)?x.paymentHistory.slice():[];hist.push({action:pago?'Marcado como pago':'Pagamento reaberto como pendente',at:now,by:state.user.email});return {...x,paymentStatus:pago?'Pago':'Pendente',paidAt:pago?now:null,paidBy:pago?state.user.email:null,paymentHistory:hist}});
 if(pago)adicionarAvisoPagamento(d,atual,now,'Coordenação');
 saveDB(d);solicitacoes();
}
function marcarTodosReembolsos(checked){document.querySelectorAll('.sol-reembolso-select').forEach(el=>{el.checked=!!checked})}
function marcarSelecionadosComoPagos(){
 if(!isCoordinator())return alert('Somente a coordenação pode confirmar pagamentos.');
 const ids=[...document.querySelectorAll('.sol-reembolso-select:checked')].map(el=>el.value).filter(id=>{const x=getSolicitacoes().find(r=>r.id===id);return x&&reembolsoPendentePagamento(x)});if(!ids.length)return alert('Selecione pelo menos um reembolso pendente.');
 if(!confirm(`Confirmar que ${ids.length} reembolso(s) foram pagos? Essa ação manterá os registros no histórico.`))return;
 let d=db(),now=new Date().toISOString(),set=new Set(ids);
 const selecionados=(d.solicitacoes||[]).filter(x=>set.has(x.id)&&x.tipo==='Reembolso');
 d.solicitacoes=(d.solicitacoes||[]).map(x=>{if(!set.has(x.id)||x.tipo!=='Reembolso')return x;let hist=Array.isArray(x.paymentHistory)?x.paymentHistory.slice():[];hist.push({action:'Marcado como pago em lote',at:now,by:state.user.email});return {...x,paymentStatus:'Pago',paidAt:now,paidBy:state.user.email,paymentHistory:hist}});
 selecionados.forEach(x=>adicionarAvisoPagamento(d,x,now,'Coordenação · pagamento em lote'));
 saveDB(d);alert(`${ids.length} reembolso(s) marcado(s) como pago(s). O histórico foi preservado e os colaboradores foram notificados no aplicativo.`);solicitacoes();
}
function reembolsosParaRelatorio(){
 if(!isCoordinator())return [];
 const modo=document.getElementById('solRelatorioFiltro')?.value||'Pendente';
 return reembolsosSolicitacao().filter(x=>modo==='Todos'||(modo==='Pendente'?reembolsoPendentePagamento(x):statusPagamentoReembolso(x)==='Pago')).sort((a,b)=>(a.createdAt||'').localeCompare(b.createdAt||''));
}
function agruparReembolsos(lista){
 const grupos=new Map();
 lista.forEach(x=>{const nome=(x.favorecido||x.requesterName||'Não informado').trim(),pix=(x.pix||'Não informado').trim(),key=nome.toLocaleLowerCase('pt-BR')+'|'+pix.toLocaleLowerCase('pt-BR');if(!grupos.has(key))grupos.set(key,{nome,pix,itens:[]});grupos.get(key).itens.push(x)});
 return [...grupos.values()].sort((a,b)=>a.nome.localeCompare(b.nome,'pt-BR'));
}
function textoRelatorioReembolsos(lista){
 const grupos=agruparReembolsos(lista),total=totalReembolsos(lista),modo=document.getElementById('solRelatorioFiltro')?.value||'Pendente';
 let linhas=['*MMS SUPORTE LOGÍSTICA*','*CONTROLE DE REEMBOLSOS / PAGAMENTOS*','Filtro: '+(modo==='Todos'?'Todos os registros':modo),`Gerado em: ${new Date().toLocaleString('pt-BR')}`,''];
 if(!lista.length)linhas.push('Nenhuma solicitação encontrada para este filtro.');
 grupos.forEach(g=>{linhas.push('*'+g.nome.toUpperCase()+'*','PIX: '+g.pix,'Solicitações:');g.itens.forEach(x=>{const data=x.createdAt?new Date(x.createdAt).toLocaleDateString('pt-BR'):'Data não informada';linhas.push(`• ${data} — ${fmtValorReembolso(x.valor)} — ${statusPagamentoReembolso(x)}`,`  Motivo: ${x.motivo||'Não informado'}`)});linhas.push(`*Subtotal: ${fmtValorReembolso(totalReembolsos(g.itens))}*`,'')});
 linhas.push('*TOTAL GERAL: '+fmtValorReembolso(total)+'*');const semValor=lista.filter(x=>!valorReembolsoValido(x)).length;if(semValor)linhas.push(`Atenção: ${semValor} solicitação(ões) antiga(s) sem valor cadastrado não entram no total.`);return linhas.join('\n');
}
async function copiarRelatorioReembolsos(){
 if(!isCoordinator())return alert('Somente a coordenação pode gerar o relatório financeiro.');
 const lista=reembolsosParaRelatorio();if(!lista.length)return alert('Não há reembolsos para o filtro selecionado.');const texto=textoRelatorioReembolsos(lista);
 try{await navigator.clipboard.writeText(texto);alert('Relatório copiado. Agora é só colar no grupo de WhatsApp.')}catch(e){const ta=document.createElement('textarea');ta.value=texto;document.body.appendChild(ta);ta.select();let ok=document.execCommand('copy');ta.remove();if(ok)alert('Relatório copiado. Agora é só colar no WhatsApp.');else prompt('Copie o relatório:',texto)}
}
function gerarPdfReembolsos(){
 if(!isCoordinator())return alert('Somente a coordenação pode gerar o relatório financeiro.');
 const lista=reembolsosParaRelatorio();if(!lista.length)return alert('Não há reembolsos para o filtro selecionado.');
 const grupos=agruparReembolsos(lista),total=totalReembolsos(lista),modo=document.getElementById('solRelatorioFiltro')?.value||'Pendente';
 const linhas=grupos.map(g=>`<section class="group"><h2>${esc(g.nome)}</h2><p><b>PIX:</b> ${esc(g.pix)}</p><table><thead><tr><th>Data</th><th>Valor</th><th>Motivo</th><th>Pagamento</th></tr></thead><tbody>${g.itens.map(x=>`<tr><td>${esc(x.createdAt?new Date(x.createdAt).toLocaleDateString('pt-BR'):'—')}</td><td>${esc(fmtValorReembolso(x.valor))}</td><td>${esc(x.motivo||'Não informado')}</td><td>${esc(statusPagamentoReembolso(x))}</td></tr>`).join('')}</tbody><tfoot><tr><td colspan="3">Subtotal</td><td>${esc(fmtValorReembolso(totalReembolsos(g.itens)))}</td></tr></tfoot></table></section>`).join('');
 const html=`<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><title>Controle de reembolsos MMS</title><style>*{box-sizing:border-box}body{font:13px Arial,sans-serif;color:#172033;margin:0 auto;padding:28px;max-width:1000px}header{border-bottom:3px solid #08a9dc;padding-bottom:14px;margin-bottom:20px}h1{color:#403b88;margin:0 0 5px;font-size:23px}header p{margin:4px 0;color:#58657a}.total{background:#edf7fb;border:1px solid #c9e6f0;border-radius:10px;padding:14px;font-size:18px;font-weight:800;margin:20px 0}.group{margin:22px 0;page-break-inside:avoid}.group h2{font-size:17px;color:#174a70;margin:0 0 5px}.group p{margin:5px 0 10px}table{width:100%;border-collapse:collapse}th,td{border:1px solid #d7e0e9;padding:8px;text-align:left;vertical-align:top}th{background:#eff4f8;font-size:11px;text-transform:uppercase}td:nth-child(2),td:nth-child(4){white-space:nowrap}tfoot td{font-weight:800;background:#f7f9fb}.note{font-size:11px;color:#667085;margin-top:24px}@media print{body{padding:0}.group{break-inside:avoid}}</style></head><body><header><h1>MMS SUPORTE LOGÍSTICA</h1><p>Controle de reembolsos e pagamentos</p><p>Filtro: ${esc(modo==='Todos'?'Todos os registros':modo)} · Gerado em ${esc(new Date().toLocaleString('pt-BR'))}</p></header><div class="total">TOTAL GERAL: ${esc(fmtValorReembolso(total))}</div>${linhas}<p class="note">Relatório gerado pelo MMS Central Operacional. Solicitações sem valor cadastrado não são incluídas no total.</p><script>window.onload=()=>window.print()<\/script></body></html>`;
 if(window.NativeMMS&&typeof NativeMMS.printHtml==='function'){NativeMMS.printHtml(html);return}
 const w=window.open('','_blank');if(!w)return alert('Permita a abertura de janelas para gerar o PDF. Na impressão, escolha “Salvar como PDF” e depois compartilhe o arquivo.');w.document.open();w.document.write(html);w.document.close();
}
/* ===== FIM SOLICITAÇÕES ===== */

init();
</script>
</body></html>
