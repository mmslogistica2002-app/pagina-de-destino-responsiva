<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#08a9dc">
<title>MMS Central Operacional</title>
<style>
:root{--cyan:#08a9dc;--cyan2:#e8f8fd;--navy:#403b88;--ink:#172033;--muted:#6c7890;--line:#e5eaf1;--bg:#f4f7fb;--white:#fff;--yellow:#f4cf35;--green:#16865b;--red:#c43b4c;--shadow:0 12px 32px rgba(26,43,77,.08)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink)}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0}.hidden{display:none!important}
.app{min-height:100vh}.topbar{height:72px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 max(22px,calc((100vw - 1180px)/2));position:sticky;top:0;z-index:5}.brand{display:flex;align-items:center;gap:12px}.brand img{width:54px;height:54px;object-fit:contain}.brand strong{display:block;color:var(--navy);font-size:15px;letter-spacing:.02em}.brand small{color:var(--muted);font-size:11px}.top-right{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:13px}.avatar{width:34px;height:34px;border-radius:50%;background:var(--cyan2);color:var(--navy);display:grid;place-items:center;font-weight:800}
.shell{max-width:1180px;margin:0 auto;padding:28px 22px 60px}.eyebrow{font-size:11px;font-weight:800;letter-spacing:.13em;color:var(--cyan);text-transform:uppercase}.hero{background:linear-gradient(115deg,#403b88 0%,#245eaa 54%,#08a9dc 100%);border-radius:22px;padding:30px 34px;color:#fff;position:relative;overflow:hidden;box-shadow:var(--shadow)}.hero:after{content:"";position:absolute;width:260px;height:260px;border:38px solid rgba(255,255,255,.12);border-radius:50%;right:-50px;top:-105px}.hero h1{font-size:clamp(25px,4vw,36px);margin:8px 0}.hero p{max-width:650px;color:#e8f5ff;margin:0;line-height:1.6}.hero .eyebrow{color:#aeeaff}.section-head{display:flex;justify-content:space-between;align-items:end;margin:28px 0 14px}.section-head h2{margin:0;font-size:20px}.section-head p{margin:5px 0 0;color:var(--muted);font-size:13px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.tile{background:#fff;border:1px solid var(--line);border-radius:18px;padding:22px;text-align:left;box-shadow:0 3px 12px rgba(30,50,80,.025);transition:.18s;min-height:175px}.tile:hover{transform:translateY(-2px);box-shadow:var(--shadow);border-color:#b6e8f6}.tile .ico{width:46px;height:46px;border-radius:14px;background:var(--cyan2);display:grid;place-items:center;font-size:23px;margin-bottom:15px}.tile h3{margin:0 0 7px;font-size:17px}.tile p{margin:0;color:var(--muted);font-size:13px;line-height:1.5}.tile .arrow{float:right;color:var(--cyan);font-size:20px}
.panel{background:#fff;border:1px solid var(--line);border-radius:18px;padding:22px;box-shadow:0 3px 12px rgba(30,50,80,.025)}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}.btn{padding:11px 16px;border-radius:11px;font-weight:700;font-size:13px;display:inline-flex;align-items:center;justify-content:center;gap:8px}.primary{background:var(--cyan);color:#fff}.primary:hover{background:#078fbd}.secondary{background:#eef2f8;color:#33415d}.outline{background:#fff;border:1px solid var(--line);color:#33415d}.danger{background:#fff0f1;color:var(--red)}.small{padding:7px 10px;font-size:12px}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.field{display:flex;flex-direction:column;gap:6px}.field.full{grid-column:1/-1}.field label{font-size:12px;font-weight:750;color:#46536b}.field input,.field select,.field textarea{border:1px solid #dce3ed;border-radius:10px;padding:11px 12px;background:#fff;color:var(--ink);outline:none;width:100%}.field textarea{min-height:112px;resize:vertical}.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--cyan);box-shadow:0 0 0 3px #08a9dc20}
.page-title{display:flex;align-items:center;gap:12px;margin-bottom:18px}.back{background:#fff;border:1px solid var(--line);border-radius:10px;padding:9px 12px;color:var(--navy);font-weight:700}.page-title h1{font-size:23px;margin:0}.page-title p{margin:4px 0 0;color:var(--muted);font-size:13px}
.notice{border-radius:12px;padding:12px 14px;background:#fff8df;color:#725c10;font-size:12px;line-height:1.5;margin-bottom:16px}.muted{color:var(--muted)}.pill{display:inline-flex;padding:5px 9px;border-radius:99px;font-size:11px;font-weight:800;background:#edf1f7;color:#536078}.pill.pending{background:#fff4d8;color:#8b6810}.pill.approved{background:#e4f7ef;color:#14764e}.pill.blocked{background:#ffeaec;color:#b22f42}
.auth-wrap{min-height:100vh;display:grid;place-items:center;padding:24px;background:linear-gradient(140deg,#e9f9fd,#f6f7fc 55%,#ecebfa)}.auth{width:min(440px,100%);background:#fff;border-radius:22px;padding:30px;box-shadow:var(--shadow)}.auth-logo{display:block;width:150px;height:130px;object-fit:contain;margin:0 auto 10px}.auth h1{text-align:center;margin:8px 0 5px;font-size:23px;color:var(--navy)}.auth>p{text-align:center;color:var(--muted);font-size:13px;margin:0 0 22px}.auth .field{margin-bottom:13px}.auth .btn{width:100%;margin-top:8px}.auth-links{text-align:center;margin-top:16px;font-size:12px;color:var(--muted)}.link{color:#078fbd;font-weight:750;cursor:pointer}
.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:left;padding:12px;border-bottom:1px solid var(--line);white-space:nowrap}th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.drop{border:2px dashed #b9dce8;border-radius:16px;padding:28px;text-align:center;background:#f7fcfe}.drop .big{font-size:34px}.drop p{color:var(--muted);font-size:13px}.preview{max-width:100%;max-height:240px;border-radius:12px;margin-top:12px}.attachment-grid{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}.attachment-grid img{width:120px;height:90px;object-fit:cover;border:1px solid var(--line);border-radius:10px}.crop-wrap{margin-top:14px;background:#f7f9fc;border:1px solid var(--line);border-radius:14px;padding:12px}.crop-stage{position:relative;display:inline-block;max-width:100%;line-height:0;touch-action:none}.crop-stage canvas{max-width:100%;height:auto;border-radius:8px;display:block}.crop-stage .crop-box{position:absolute;border:2px solid #08a9dc;background:#08a9dc22;pointer-events:none;display:none}.crop-help{font-size:12px;color:var(--muted);margin:8px 0}.ocr-text{min-height:210px}.status{font-size:12px;color:var(--muted);margin-left:8px}.footer{text-align:center;color:#97a1b2;font-size:11px;margin-top:34px}
@media(max-width:700px){.topbar{padding:0 14px}.shell{padding:18px 14px 45px}.hero{padding:24px}.grid{grid-template-columns:1fr}.form-grid{grid-template-columns:1fr}.field.full{grid-column:auto}.top-right .userlabel{display:none}.panel{padding:17px}.section-head{align-items:start;flex-direction:column;gap:5px}}
.plant-meta{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.plant-img{width:100%;max-height:70vh;object-fit:contain;border:1px solid var(--line);border-radius:12px;background:#fff;cursor:zoom-in;margin:14px 0}.pl-zoom{position:fixed;inset:0;background:rgba(10,16,30,.93);z-index:50;display:flex;flex-direction:column}.pl-zoom-bar{display:flex;gap:8px;justify-content:flex-end;padding:12px}.pl-zoom-body{flex:1;overflow:auto;padding:0 12px 12px;touch-action:pan-x pan-y pinch-zoom}.pl-zoom-body img{width:100%;max-width:none;display:block;margin:0 auto;background:#fff}

.pill.status-aguardando,.status-select.status-aguardando{background:#fff4c2!important;color:#805b00!important;border:1px solid #f0d66b!important}
.pill.status-programado,.status-select.status-programado{background:#e5f0ff!important;color:#1757a6!important;border:1px solid #b9d4fa!important}
.pill.status-confirmado,.status-select.status-confirmado{background:#e2f6eb!important;color:#116b40!important;border:1px solid #a9dfbf!important}
.pill.status-alterado,.status-select.status-alterado{background:#fff0dc!important;color:#98530a!important;border:1px solid #f4c68a!important}
.pill.status-cancelado,.status-select.status-cancelado{background:#ffe7e9!important;color:#a51f32!important;border:1px solid #f3b7bf!important}
.pill.status-realizado,.status-select.status-realizado{background:#e8eef0!important;color:#3d5860!important;border:1px solid #c5d4d8!important}
.status-select{font-weight:750}
.prog-records-stack{display:flex;flex-direction:column;gap:12px}
.prog-record-meta{display:flex;flex-direction:column;align-items:flex-start;gap:6px}
.prog-detail-list{display:flex;flex-direction:column;align-items:stretch;gap:8px}
.prog-detail-line{display:block;line-height:1.45;overflow-wrap:anywhere}

/* Cartões compactos e expansíveis da programação diária */
.prog-compact-card{padding:0;overflow:hidden}
.prog-compact-card>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px;min-width:0;padding:14px 18px;outline:none}
.prog-compact-card>summary::-webkit-details-marker{display:none}
.prog-compact-card>summary::after{content:"＋";font-size:18px;line-height:1;color:var(--cyan);font-weight:800;margin-left:auto;flex:0 0 auto}
.prog-compact-card[open]>summary::after{content:"−"}
.prog-compact-badges{display:flex;align-items:center;gap:6px;flex:0 0 auto;flex-wrap:wrap}
.prog-compact-text{font-size:13px;font-weight:750;color:var(--ink);line-height:1.45;min-width:0;flex:1;overflow-wrap:anywhere}
.prog-order-controls{display:inline-flex;align-items:center;gap:4px;flex:0 0 auto;margin-left:4px}
.prog-order-btn{width:30px;height:30px;border:1px solid var(--line);border-radius:8px;background:#f7fafc;color:var(--navy);font-weight:800;cursor:pointer;line-height:1}
.prog-order-btn:hover:not(:disabled){background:#e7f3fa;border-color:var(--cyan)}
 .prog-order-btn:disabled{opacity:.3;cursor:not-allowed}
.prog-no-attendance{display:inline-flex;align-items:center;gap:8px;margin:-4px 0 12px;padding:7px 10px;border:1px solid var(--line);border-radius:9px;background:#fff;color:var(--ink);font-size:12px;font-weight:700;cursor:pointer}
.prog-no-attendance input{width:16px;height:16px;accent-color:var(--cyan);margin:0}
.prog-no-attendance input:disabled{cursor:not-allowed}
.prog-no-attendance-message{margin:0 0 12px;padding:11px 13px;border:1px dashed #a9c9d7;border-radius:10px;background:#f1f8fb;color:#35566a;font-size:13px;font-weight:750}
.prog-copy-btn{display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto;width:30px;height:30px;border:1px solid #bfe5ef;border-radius:8px;background:#eaf8fc;color:#087fa5;font-weight:900;font-size:13px;cursor:pointer;z-index:1}
.prog-copy-btn:hover{background:#d8f2fa;border-color:var(--cyan)}
.prog-share-phone-option{margin:14px 0 0;background:#eef9fd;border-color:#bce8f5;font-weight:750}
.prog-share-phone-option input{accent-color:var(--cyan)}
.prog-order-hint{font-size:11px;color:var(--muted);margin:5px 0 0}
.prog-drag-handle{display:inline-flex;align-items:center;justify-content:center;width:28px;height:30px;border:1px dashed var(--line);border-radius:8px;color:var(--muted);cursor:grab;user-select:none;font-size:18px}
.prog-drag-handle:active,.prog-drag-handle.is-dragging{cursor:grabbing;opacity:.5}
.prog-compact-card.drag-over{outline:2px dashed var(--cyan)}
@media(max-width:700px){.prog-order-controls{margin-left:auto}.prog-order-btn{width:32px;height:32px}.prog-copy-btn{width:32px;height:32px}}
.prog-expanded-content{padding:16px 18px 18px;border-top:1px solid var(--line)}
@media(max-width:700px){.prog-compact-card>summary{align-items:flex-start;flex-wrap:wrap;padding:13px}.prog-compact-text{flex-basis:100%;order:3}.prog-compact-card>summary::after{margin-left:auto}}
/* Seleção de empresas e localidades para exportação da programação */
.prog-share-overlay{position:fixed;inset:0;z-index:100;background:rgba(13,23,42,.58);display:flex;align-items:center;justify-content:center;padding:16px}
.prog-share-dialog{width:min(780px,100%);max-height:92vh;background:#fff;border-radius:20px;box-shadow:0 24px 70px rgba(0,0,0,.25);display:flex;flex-direction:column;overflow:hidden}
.prog-share-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:20px 22px;border-bottom:1px solid var(--line)}
.prog-share-head h2{margin:0;font-size:20px;color:var(--navy)}.prog-share-head p{margin:5px 0 0;color:var(--muted);font-size:12px;line-height:1.45}
.prog-share-body{padding:18px 22px;overflow:auto}.prog-share-columns{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.prog-share-group{border:1px solid var(--line);border-radius:14px;padding:14px}.prog-share-group h3{font-size:14px;margin:0 0 10px}
.prog-share-options{display:grid;grid-template-columns:1fr 1fr;gap:7px}.prog-share-check{display:flex;align-items:center;gap:8px;padding:8px 9px;border:1px solid #e8edf4;border-radius:9px;font-size:12px;min-width:0}.prog-share-check input{accent-color:var(--cyan);width:16px;height:16px;flex:0 0 auto}.prog-share-check span{overflow-wrap:anywhere}
.prog-share-check.all{background:#eef9fd;border-color:#bce8f5;font-weight:800;margin-bottom:8px}.prog-share-foot{display:flex;justify-content:flex-end;gap:9px;flex-wrap:wrap;padding:15px 22px;border-top:1px solid var(--line);background:#fbfcfe}
@media(max-width:650px){.prog-share-columns{grid-template-columns:1fr}.prog-share-options{grid-template-columns:1fr 1fr}.prog-share-head{padding:17px}.prog-share-body{padding:14px}.prog-share-foot{padding:13px 14px}}

/* ===== MMS QUALITY ===== */
.quality-hero{background:linear-gradient(120deg,#132b50 0%,#244d7c 56%,#08a9dc 100%);color:#fff;border-radius:20px;padding:25px 28px;margin-bottom:18px;position:relative;overflow:hidden;box-shadow:var(--shadow)}
.quality-hero:after{content:"";position:absolute;width:210px;height:210px;border:28px solid rgba(255,255,255,.11);border-radius:50%;right:-50px;top:-95px}
.quality-hero .eyebrow{color:#bceeff}.quality-hero h2{margin:7px 0;font-size:26px}.quality-hero p{margin:0;color:#e4f3ff;max-width:720px;line-height:1.55;font-size:13px}
.quality-kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:16px 0}.quality-kpi{background:#fff;border:1px solid var(--line);border-radius:15px;padding:16px}.quality-kpi small{display:block;color:var(--muted);font-size:11px;font-weight:750}.quality-kpi strong{display:block;font-size:27px;color:var(--navy);margin-top:5px}.quality-link{display:flex;gap:9px;align-items:center;min-width:0}.quality-link input{min-width:0;flex:1;border:1px solid #dce3ed;border-radius:10px;padding:11px;background:#f8fbff;color:#31405a}
.quality-qr{width:190px;height:190px;background:#fff;border:1px solid var(--line);border-radius:14px;display:grid;place-items:center;padding:8px}.quality-qr img,.quality-qr canvas{max-width:100%;height:auto!important}.quality-response{border:1px solid var(--line);border-radius:14px;padding:15px;margin-bottom:10px;background:#fff}.quality-response-head{display:flex;gap:10px;align-items:flex-start;justify-content:space-between}.quality-response p{margin:5px 0;font-size:13px;line-height:1.5;overflow-wrap:anywhere}.quality-score{font-weight:850;color:var(--navy);font-size:18px;white-space:nowrap}.quality-chip{display:inline-flex;align-items:center;border-radius:30px;padding:5px 9px;font-size:11px;font-weight:800;background:#eef2f8;color:#40506c}.quality-chip.elogio{background:#e4f7ef;color:#14764e}.quality-chip.sugestao{background:#e8f4ff;color:#1757a6}.quality-chip.reclamacao{background:#fff4d8;color:#8b6810}.quality-chip.ocorrencia{background:#ffeaec;color:#b22f42}
.quality-public-wrap{min-height:100vh;background:linear-gradient(145deg,#eaf8fc,#f5f7fb 54%,#eef0fb);padding:26px 14px}.quality-public{max-width:760px;margin:0 auto;background:#fff;border:1px solid var(--line);border-radius:22px;box-shadow:0 18px 50px rgba(26,43,77,.12);overflow:hidden}.quality-public-head{background:linear-gradient(115deg,#403b88,#245eaa 58%,#08a9dc);color:#fff;padding:25px 28px}.quality-public-head h1{margin:10px 0 5px;font-size:26px}.quality-public-head p{margin:0;color:#eaf7ff;font-size:13px;line-height:1.5}.quality-public-body{padding:24px 28px}.quality-public-body .field{margin-bottom:13px}.quality-public-body fieldset{border:1px solid var(--line);border-radius:13px;padding:13px 14px;margin:0 0 12px}.quality-public-body legend{font-size:13px;font-weight:800;color:#40506c;padding:0 5px}.quality-rating{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin-top:8px}.quality-rating label{border:1px solid var(--line);border-radius:10px;padding:9px 4px;text-align:center;cursor:pointer;font-size:12px;font-weight:800;color:#526078}.quality-rating input{accent-color:var(--cyan);display:block;margin:0 auto 5px}.quality-privacy{font-size:11px;color:var(--muted);line-height:1.5;background:#f6f9fc;border-radius:11px;padding:12px;margin:15px 0}.quality-success{text-align:center;padding:54px 24px}.quality-success .mark{width:66px;height:66px;border-radius:50%;display:grid;place-items:center;margin:0 auto 14px;background:#e4f7ef;color:#14764e;font-size:30px;font-weight:900}
@media(max-width:760px){.quality-kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.quality-public-head,.quality-public-body{padding:21px 17px}.quality-response-head{flex-direction:column}.quality-link{flex-wrap:wrap}.quality-link input{flex-basis:100%}}


/* ===== MMS: safe area, tema escuro e ajustes responsivos ===== */
@media(max-width:700px){
  .mms-native-apk .topbar{
    height:calc(72px + max(env(safe-area-inset-top, 0px), 24px));
    min-height:calc(72px + max(env(safe-area-inset-top, 0px), 24px));
    padding: max(env(safe-area-inset-top, 0px), 24px) 14px 0;
  }
}
.theme-toggle{width:35px;height:35px;padding:0;border-radius:10px;font-size:16px;flex:0 0 auto}
body.dark-mode{
  color-scheme:dark;
  --cyan:#38bce7;--cyan2:#153847;--navy:#c0bdff;--ink:#edf3fb;
  --muted:#a9b6c9;--line:#2b394e;--bg:#0c1421;--white:#142033;
  --shadow:0 12px 32px rgba(0,0,0,.32);
  background:var(--bg);color:var(--ink)
}
body.dark-mode .topbar{background:#111c2c;border-color:var(--line);color:var(--ink)}
body.dark-mode .tile,body.dark-mode .panel,body.dark-mode .auth,
body.dark-mode .quality-kpi,body.dark-mode .quality-response,
body.dark-mode .prog-no-attendance{background:#17263a;border-color:#34445c;color:var(--ink)}
body.dark-mode .prog-no-attendance-message{background:#172c3a;border-color:#34576a;color:#d4e8f2}
body.dark-mode .prog-copy-btn{background:#153847;border-color:#28637a;color:#bceeff}
body.dark-mode .prog-share-phone-option{background:#153847;border-color:#28637a}
body.dark-mode .quality-public,body.dark-mode .prog-share-dialog,
body.dark-mode .prog-share-group,body.dark-mode .crop-wrap,
body.dark-mode .drop{background:#142033;color:var(--ink);border-color:var(--line)}
body.dark-mode .tile p,body.dark-mode .page-title p,body.dark-mode .section-head p,
body.dark-mode .brand small,body.dark-mode .muted{color:var(--muted)}
body.dark-mode .tile:hover{border-color:#23617a;box-shadow:var(--shadow)}
body.dark-mode .panel,body.dark-mode .tile{box-shadow:0 3px 14px rgba(0,0,0,.18)}
body.dark-mode .field label,body.dark-mode .quality-public-body legend{color:#c2cde0}
body.dark-mode .field input,body.dark-mode .field select,body.dark-mode .field textarea,
body.dark-mode input,body.dark-mode select,body.dark-mode textarea,
body.dark-mode .quality-link input{background:#0d1828;color:var(--ink);border-color:#34445c}
body.dark-mode .field input::placeholder,body.dark-mode .field textarea::placeholder{color:#8493aa}
body.dark-mode .btn.outline,body.dark-mode .back{background:#1a2a40;color:#dbe8f8;border-color:#34445c}
body.dark-mode .btn.secondary{background:#23334a;color:#e1eaf7}
body.dark-mode .btn.danger{background:#3b202b;color:#ffb9c3}
body.dark-mode .notice{background:#3b341b;color:#f5df91;border:1px solid #66592b}
body.dark-mode th,body.dark-mode td{border-color:var(--line);color:var(--ink)}
body.dark-mode th{color:#a9b6c9}
body.dark-mode .prog-share-foot{background:#101b2b;border-color:var(--line)}
body.dark-mode .prog-share-check{background:#17263a;border-color:#34445c;color:var(--ink)}
body.dark-mode .prog-share-check.all{background:#153847;border-color:#28637a}
body.dark-mode .quality-public-wrap{background:linear-gradient(145deg,#101d2b,#0d1422 54%,#171a34)}
body.dark-mode .quality-public-body fieldset{border-color:var(--line)}
body.dark-mode .quality-privacy{background:#1a2a40;color:#bac7d9}
body.dark-mode .quality-response p{color:var(--muted)}
body.dark-mode .quality-kpi strong{color:#d1ceff}
body.dark-mode .quality-score{color:#d1ceff}
body.dark-mode .drop p,body.dark-mode .crop-help{color:var(--muted)}
body.dark-mode .plant-img,body.dark-mode .pl-zoom-body img{background:#fff}
body.dark-mode .status{color:var(--muted)}
body.dark-mode .auth-wrap{background:linear-gradient(140deg,#101e2e,#0d1422 55%,#191833)}
body.dark-mode .prog-order-btn{background:#1b2d44;color:#dce8fa;border-color:#34445c}
body.dark-mode .prog-order-btn:hover:not(:disabled){background:#203e56}
body.dark-mode .quality-rating label{color:#d6e0ef;border-color:#34445c}
body.dark-mode .quality-public-body .field label{color:#c2cde0}
body.dark-mode .footer{color:#73829a}

body.dark-mode h1,body.dark-mode h2,body.dark-mode h3,body.dark-mode h4,
body.dark-mode .prog-compact-text,body.dark-mode .prog-expanded-content,
body.dark-mode .prog-record-title,body.dark-mode .table-wrap,
body.dark-mode .prog-share-title,body.dark-mode .quality-response-head,
body.dark-mode .pl-zoom-bar{color:var(--ink)}
body.dark-mode .prog-compact-card,body.dark-mode .prog-expanded-content,
body.dark-mode .prog-record,body.dark-mode .prog-share-check,
body.dark-mode .report-preview,body.dark-mode .report-card,
body.dark-mode .modal-card,body.dark-mode .modal-content,
body.dark-mode .table-wrap,body.dark-mode .ocr-result,
body.dark-mode .history-card,body.dark-mode .quality-filter,
body.dark-mode .quality-empty,body.dark-mode .pl-zoom-bar{

body.dark-mode .prog-compact-card summary,body.dark-mode .prog-compact-card summary strong,
body.dark-mode .prog-compact-card summary b,body.dark-mode .prog-expanded-content b,
body.dark-mode .prog-expanded-content strong,body.dark-mode .panel b,
body.dark-mode .panel strong,body.dark-mode td b,body.dark-mode td strong{color:#edf3fb}

body.dark-mode .back:hover,body.dark-mode .btn.outline:hover{background:#24364f}

/* ===== SOLICITAÇÕES ===== */
.request-type-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-bottom:20px}
.request-card{background:var(--white);border:1px solid var(--line);border-radius:16px;padding:18px}
.request-card h3{margin:0 0 8px;font-size:16px}
.request-card p{margin:0;color:var(--muted);font-size:13px;line-height:1.5}
.request-status{display:inline-flex;align-items:center;border-radius:99px;padding:5px 9px;font-size:11px;font-weight:800;background:#e6f1fc;color:#24598c}
.request-status.em-analise{background:#fff2d6;color:#8a6100}
.request-status.concluida{background:#e2f6eb;color:#116b40}
.request-status.nao-aprovada{background:#ffe7e9;color:#a51f32}
.request-file{display:inline-flex;gap:7px;align-items:center;margin-top:8px;color:#087fa8;font-size:12px;font-weight:750;cursor:pointer}
.request-list{display:grid;gap:12px}
.request-meta{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.request-nav-tile{position:relative;text-align:left;min-height:150px}
.request-nav-tile.is-active{border-color:var(--accent);box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 16%,transparent)}
.request-nav-count{display:inline-flex;align-items:center;justify-content:center;min-width:28px;height:24px;padding:0 8px;border-radius:99px;background:var(--bg);border:1px solid var(--line);font-size:11px;font-weight:850;margin-top:8px}
.request-inbox-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.request-payment-notice{border-left:4px solid #16865b;background:#e8f7ef;padding:12px 14px;border-radius:10px;margin:10px 0;color:#145b39}
.request-payment-notice p{margin:4px 0 0;color:inherit;font-size:13px}
body.dark-mode .request-nav-tile.is-active{border-color:#38bce7;box-shadow:0 0 0 2px #38bce733}
body.dark-mode .request-nav-count{background:#1a2a40;color:var(--ink);border-color:var(--line)}
body.dark-mode .request-payment-notice{background:#123b30;color:#baf2d5}

.request-detail{white-space:pre-wrap;overflow-wrap:anywhere;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px;margin-top:10px;font-size:13px;line-height:1.5}
@media(max-width:700px){.request-type-grid{grid-template-columns:1fr}}
body.dark-mode .request-card,body.dark-mode .request-detail{background:#142033;color:var(--ink);border-color:var(--line)}
body.dark-mode .request-detail{background:#101a29}


/* ===== MEDIÇÕES ===== */
.medicao-tile{min-height:168px}
.medicao-filter-panel{margin-bottom:18px}
.medicao-panel-heading{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;margin-bottom:18px}
.medicao-panel-heading h2{margin:0 0 5px;font-size:19px}
.medicao-panel-heading p{margin:0;color:var(--muted);font-size:13px;line-height:1.5}
.medicao-client-tag{display:inline-flex;align-items:center;border-radius:999px;padding:7px 11px;font-size:10px;font-weight:850;letter-spacing:.08em;background:#e9f3ff;color:#245aa0;white-space:nowrap}
.medicao-client-tag.constellation{background:#e6f4e7;color:#246b2c}
.medicao-client-tag.transporte{background:#e1f7fc;color:#087c9c}
.medicao-result-head{margin-top:24px}
.medicao-table-panel{padding:12px;overflow:hidden}
.medicao-table{border-radius:10px}
.medicao-table table{min-width:900px;font-size:12px}
.medicao-table th{background:#2874c8;color:#fff;padding:10px 8px;white-space:normal;text-align:center}
.medicao-table.dof th{background:#3978d6}
.medicao-table.tfmc th{background:#087fb7}
.medicao-table.constellation th{background:#26712a}
.medicao-table.transporte th{background:#04a9d0}
.medicao-table td{padding:8px 7px;color:var(--ink);vertical-align:middle}
.medicao-table tbody tr:nth-child(even){background:#f1f4f8}
.medicao-table tbody tr:hover{background:#e7f3f8}
body.dark-mode .medicao-client-tag{background:#1b3854;color:#c9e4ff}
body.dark-mode .medicao-client-tag.constellation{background:#1d3b2b;color:#b9ebc2}
body.dark-mode .medicao-client-tag.transporte{background:#143b49;color:#b5effc}
body.dark-mode .medicao-table tbody tr:nth-child(even){background:#1a2a40}
body.dark-mode .medicao-table tbody tr:hover{background:#203c55}
@media(max-width:700px){.medicao-panel-heading{flex-direction:column}.medicao-table-panel{padding:10px}.medicao-result-head{align-items:flex-start}}

/* Importação reversa da programação WhatsApp */
.import-whatsapp-panel{margin-bottom:18px}
.import-whatsapp-panel textarea{min-height:220px;resize:vertical;line-height:1.55}
.import-actions{gap:9px;flex-wrap:wrap}
.import-table table{min-width:1180px;font-size:11px}
.import-table th:first-child,.import-table td:first-child{position:sticky;left:0;background:var(--panel);z-index:2;text-align:center;min-width:76px}
.import-table th:first-child{background:#087c9c;color:#fff}
.import-table td:first-child input{width:18px;height:18px;accent-color:var(--accent)}
.import-table tbody tr.import-row-excluded{opacity:.43}
.import-table tbody tr.import-row-excluded td{text-decoration:line-through}
.import-table tbody tr.import-row-excluded td:first-child input{text-decoration:none}
body.dark-mode .import-table th:first-child,body.dark-mode .import-table td:first-child{background:#142033}
body.dark-mode .import-table th:first-child{background:#087c9c}
@media(max-width:700px){.import-whatsapp-panel textarea{min-height:180px}.import-actions .btn{flex:1 1 100%}}
</style>

function toggleTheme(){let dark=!document.body.classList.contains('dark-mode');try{localStorage.setItem(themeKey(),dark?'dark':'light')}catch(e){}applyTheme()}
function btn(label,cls,action){return `<button class="btn ${cls}" onclick="${action}">${label}</button>`}
function header(){let dark=document.body.classList.contains('dark-mode');return `<header class="topbar"><div class="brand"><img src="${logo()}" alt="MMS"><div><strong>CENTRAL OPERACIONAL</strong><small>SUPORTE À OPERAÇÃO OFFSHORE</small></div></div><div class="top-right"><span class="userlabel">${esc(state.user.name)}</span><span class="avatar">${initials(state.user.name)}</span><button class="btn outline small theme-toggle" id="themeToggle" onclick="toggleTheme()" title="${dark?'Ativar modo claro':'Ativar modo escuro'}" aria-label="${dark?'Ativar modo claro':'Ativar modo escuro'}">${dark?'☀️':'🌙'}</button><button class="btn outline small" onclick="logout()">Sair</button></div></header>`}
function shell(content){applyTheme();root.innerHTML=`<div class="app">${header()}<main class="shell">${content}<div class="footer">MMS SUPORTE LOGÍSTICA · CENTRAL OPERACIONAL · VERSÃO DEMONSTRATIVA · PDF r8</div></main></div>`}
function pageTitle(title,sub){return `<div class="page-title"><button class="back" onclick="go('home')">← Voltar</button><div><h1>${title}</h1><p>${sub}</p></div></div>`}
function home(){state.page='home';let admin=isCoordinator();shell(`<section class="hero"><div class="eyebrow">MMS SUPORTE LOGÍSTICA</div><h1>Olá, ${esc(state.user.name.split(' ')[0])}.</h1><p>Central de ferramentas para apoiar a rotina dos prepostos na logística de pessoal offshore. Acesse os recursos operacionais em poucos toques.</p></section>${renderAvisosPagamentoSolicitacoes()}<div class="section-head"><div><h2>Ferramentas disponíveis</h2><p>Selecione o módulo que deseja utilizar.</p></div></div><div class="grid"><button class="tile" onclick="go('report')"><span class="arrow">↗</span><div class="ico">📋</div><h3>Gerador de relatórios</h3><p>Organize o atendimento, registre horários, ocorrências e informações de embarque e desembarque.</p></button><button class="tile" onclick="go('ocr')"><span class="arrow">↗</span><div class="ico">🔎</div><h3>Extrator de textos (OCR)</h3><p>Transforme prints e fotografias em texto editável para copiar e compartilhar.</p></button><button class="tile" onclick="go('plantonistas')"><span class="arrow">↗</span><div class="ico">🗓️</div><h3>Plantonistas</h3><p>Consulte a escala semanal dos plantonistas de cada empresa cliente.</p></button><button class="tile" onclick="go('escalasEquipes')"><span class="arrow">↗</span><div class="ico">👥</div><h3>Escalas das Equipes</h3><p>Consulte as escalas de trabalho por localidade.</p></button><button class="tile" onclick="go('programacao')"><span class="arrow">↗</span><div class="ico">🗂️</div><h3>Programação</h3><p>Organize atendimentos por região, atualize a operação e gere relatórios diários e mensais.</p></button>${admin?`<button class="tile" onclick="go('medicoes')"><span class="arrow">↗</span><div class="ico">📑</div><h3>Medições</h3><p>Gere medições mensais de embarcações e transporte a partir das programações confirmadas.</p></button>`:''}${(admin||isQualityViewer())?`<button class="tile" onclick="go('quality')"><span class="arrow">↗</span><div class="ico">📈</div><h3>MMS Quality</h3><p>Centralize avaliações dos clientes, acompanhe indicadores e identifique oportunidades de melhoria.</p></button>`:''}${admin?`<button class="tile" onclick="go('admin')"><span class="arrow">↗</span><div class="ico">👥</div><h3>Administração de usuários</h3><p>Acesso exclusivo ao coordenador MMS para aprovar usuários e gerenciar permissões.</p></button>`:''}<button class="tile" onclick="go('lembretes')"><span class="arrow">↗</span><div class="ico">🔔</div><h3>Lembretes</h3><p>Cadastre comunicados e acompanhe as confirmações de ciência da equipe.</p></button><button class="tile" onclick="go('solicitacoes')"><span class="arrow">↗</span><div class="ico">📝</div><h3>Solicitações</h3><p>Envie pedidos de reembolso ou ajuste de ponto e acompanhe o andamento.</p></button></div><div class="toolbar">${btn('Meu perfil','secondary',"go('profile')")}</div>`)}
function login(){
 root.innerHTML=`<div class="auth-wrap"><div class="auth"><img class="auth-logo" src="${logo()}"><h1>MMS Central Operacional</h1><p>Acesso exclusivo aos colaboradores autorizados</p><form onsubmit="doLogin(event)"><div class="field"><label>E-mail</label><input id="email" type="email" required autocomplete="username" placeholder="seu@empresa.com"></div><div class="field"><label>Senha</label><input id="password" type="password" required autocomplete="current-password" placeholder="Sua senha"></div><button class="btn primary" id="mmsLoginButton">Entrar</button></form><div class="auth-links"><span class="link" onclick="requestMmsPasswordReset()">Esqueci minha senha</span><br><br><span class="link" onclick="signup()">Solicitar cadastro</span><br><br><span class="muted">Acesso protegido pelo Supabase · somente usuários aprovados</span></div></div></div>`;
}
async function fetchMmsProfile(authUser){
 if(!mmsSupabase)throw new Error('A biblioteca de conexão do Supabase não carregou. Atualize a página e tente novamente.');
 const {data,error}=await mmsSupabase.from('mms_profiles').select('id,email,name,role,status,permissions').eq('id',authUser.id).maybeSingle();
 if(error)throw error;
 if(!data)throw new Error('Sua conta de autenticação existe, mas o perfil MMS não foi criado. Peça à coordenação para conferir o cadastro no banco.');
 return {id:data.id,email:data.email,name:data.name,role:data.role,status:data.status,permissions:data.permissions||{}};
}
function renderMmsAccessStatus(profile,message){
 state.user=profile;
 const pending=profile.status==='pending';
 root.innerHTML=`<div class="auth-wrap"><div class="auth"><img class="auth-logo" src="${logo()}"><h1>${pending?'Cadastro aguardando aprovação':'Acesso bloqueado'}</h1><p>${esc(profile.name||profile.email)}</p><div class="notice ${pending?'warning':'danger'}">${esc(message||(pending?'Sua conta foi criada, mas ainda precisa ser aprovada pela coordenação MMS.':'Seu acesso está bloqueado. Entre em contato com a coordenação.'))}</div><button class="btn primary" onclick="refreshMmsProfile()">Verificar novamente</button><button class="btn secondary" onclick="logout()">Sair</button></div></div>`;
}
async function enterMmsWithAuthUser(authUser){
 try{
  const profile=await fetchMmsProfile(authUser);
  state.user=profile;
  if(profile.status!=='approved'){renderMmsAccessStatus(profile);return false;}
  await carregarProgramacoesSupabase();
  abrirPendenciasOuInicio();return true;
 }catch(err){
  root.innerHTML=`<div class="auth-wrap"><div class="auth"><img class="auth-logo" src="${logo()}"><h1>Não foi possível carregar seu perfil</h1><p class="muted">${esc(err.message||'Erro ao consultar seu cadastro.')}</p><button class="btn primary" onclick="refreshMmsProfile()">Tentar novamente</button><button class="btn secondary" onclick="logout()">Sair</button></div></div>`;
  return false;
 }
}
async function refreshMmsProfile(){
 if(!mmsSupabase)return login();
 const {data,error}=await mmsSupabase.auth.getUser();
 if(error||!data?.user){login();return;}
 await enterMmsWithAuthUser(data.user);
}
async function doLogin(e){
 e.preventDefault();
 if(!mmsSupabase)return alert('Não foi possível carregar a conexão com o Supabase. Verifique sua internet e atualize o aplicativo.');
 const email=document.getElementById('email').value.trim().toLowerCase(),password=document.getElementById('password').value;
 const button=document.getElementById('mmsLoginButton');if(button){button.disabled=true;button.textContent='Entrando...';}
 try{
  const {data,error}=await mmsSupabase.auth.signInWithPassword({email,password});
  if(error)return alert('Não foi possível entrar. Confira o e-mail e a senha. Detalhe: '+error.message);
  await enterMmsWithAuthUser(data.user);
 }catch(err){alert('Não foi possível conectar ao Supabase: '+(err.message||err));}
 finally{if(button){button.disabled=false;button.textContent='Entrar';}}
}
async function requestMmsPasswordReset(){
 if(!mmsSupabase)return alert('A conexão com o Supabase não está disponível.');
 const email=(document.getElementById('email')?.value||'').trim().toLowerCase();
 if(!email)return alert('Digite seu e-mail no campo acima antes de solicitar a recuperação da senha.');
 try{
  const {error}=await mmsSupabase.auth.resetPasswordForEmail(email,{redirectTo:mmsAuthRedirectUrl()});
  if(error)return alert('Não foi possível enviar o e-mail de recuperação: '+error.message);
  alert('Enviamos um link de recuperação para '+email+'. Abra o e-mail mais recente neste mesmo navegador e cadastre sua nova senha.');
 }catch(err){alert('Não foi possível conectar ao Supabase: '+(err.message||err));}
}
async function renderMmsPasswordRecovery(){
 if(!mmsSupabase)return login();
 const {data:{session},error}=await mmsSupabase.auth.getSession();
 if(error||!session){
  root.innerHTML=`<div class="auth-wrap"><div class="auth"><img class="auth-logo" src="${logo()}"><h1>Link de recuperação expirado</h1><p>Solicite um novo link na tela de login e abra o e-mail mais recente.</p><button class="btn primary" onclick="login()">Voltar ao login</button></div></div>`;
  return;
 }
 root.innerHTML=`<div class="auth-wrap"><div class="auth"><img class="auth-logo" src="${logo()}"><h1>Definir nova senha</h1><p>Crie uma senha para acessar o MMS Central Operacional.</p><form onsubmit="saveMmsRecoveredPassword(event)"><div class="field"><label>Nova senha</label><input id="mmsNewPassword" type="password" minlength="8" autocomplete="new-password" required placeholder="Mínimo de 8 caracteres"></div><div class="field"><label>Confirmar nova senha</label><input id="mmsConfirmPassword" type="password" minlength="8" autocomplete="new-password" required placeholder="Repita a nova senha"></div><button class="btn primary" id="mmsSavePasswordButton">Salvar nova senha</button></form><div class="auth-links"><span class="muted">Use uma senha exclusiva e não a compartilhe com outras pessoas.</span></div></div></div>`;
}
async function saveMmsRecoveredPassword(e){
 e.preventDefault();
 if(!mmsSupabase)return alert('Conexão com Supabase indisponível.');
 const password=document.getElementById('mmsNewPassword').value,confirmPassword=document.getElementById('mmsConfirmPassword').value;
 if(password.length<8)return alert('A senha precisa ter pelo menos 8 caracteres.');
 if(password!==confirmPassword)return alert('As senhas não coincidem.');
 const button=document.getElementById('mmsSavePasswordButton');if(button){button.disabled=true;button.textContent='Salvando...';}
 try{
  const {error}=await mmsSupabase.auth.updateUser({password});
  if(error)return alert('Não foi possível atualizar a senha: '+error.message);
  mmsPasswordRecoveryPending=false;
  // Remove o token temporário da barra de endereço após concluir a recuperação.
  try{window.history.replaceState({},document.title,window.location.pathname+window.location.search)}catch(cleanErr){}
  alert('Senha atualizada com sucesso. Agora vamos verificar a aprovação da sua conta MMS.');
  await refreshMmsProfile();
 }catch(err){alert('Não foi possível atualizar a senha: '+(err.message||err));}
 finally{if(button){button.disabled=false;button.textContent='Salvar nova senha';}}
}
function signup(){
 root.innerHTML=`<div class="auth-wrap"><div class="auth"><img class="auth-logo" src="${logo()}"><h1>Solicitar acesso</h1><p>Preencha seus dados. A coordenação MMS deverá aprovar o cadastro.</p><form onsubmit="doSignup(event)"><div class="field"><label>Nome completo</label><input id="sname" required autocomplete="name"></div><div class="field"><label>E-mail</label><input id="semail" type="email" required autocomplete="email"></div><div class="field"><label>Senha (mínimo 8 caracteres)</label><input id="spass" type="password" minlength="8" required autocomplete="new-password"></div><button class="btn primary" id="mmsSignupButton">Enviar solicitação</button></form><div class="auth-links"><span class="link" onclick="login()">Voltar ao login</span></div></div></div>`;
}
async function doSignup(e){
 e.preventDefault();
 if(!mmsSupabase)return alert('A conexão com o Supabase não está disponível.');
 const name=document.getElementById('sname').value.trim(),email=document.getElementById('semail').value.trim().toLowerCase(),password=document.getElementById('spass').value;
 const button=document.getElementById('mmsSignupButton');if(button){button.disabled=true;button.textContent='Enviando...';}
 try{
  const {data,error}=await mmsSupabase.auth.signUp({email,password,options:{data:{full_name:name},emailRedirectTo:mmsAuthRedirectUrl()}});
  if(error)return alert('Não foi possível enviar a solicitação: '+error.message);
  if(data.session&&data.user){await enterMmsWithAuthUser(data.user);return;}
  alert('Solicitação enviada. Confira seu e-mail para confirmar o cadastro. Depois, aguarde a aprovação da coordenação MMS.');
  login();
 }catch(err){alert('Não foi possível enviar a solicitação: '+(err.message||err));}
 finally{if(button){button.disabled=false;button.textContent='Enviar solicitação';}}
}
async function logout(){
 if(mmsSupabase){const {error}=await mmsSupabase.auth.signOut();if(error)console.warn('Supabase signOut:',error.message);}
 state.user=null;sessionStorage.removeItem('mms_user');login();
}
function go(p){if((p==='admin'||p==='medicoes')&&!isCoordinator()){alert(p==='admin'?'A administração de usuários é exclusiva do coordenador MMS.':'A ferramenta Medições é exclusiva da coordenação MMS.');return home()}state.page=p;const routes={home,report,ocr,admin,profile,plantonistas,escalasEquipes,lembretes,programacao,medicoes,solicitacoes,quality:mmsQuality};const abrir=routes[p]||home;abrir();}
function report(){shell(`${pageTitle('Gerador de relatórios','Selecione o tipo de atendimento para preencher o relatório')}<div class="grid"><button class="tile" onclick="openReportForm('troca')"><div class="ico">🔄</div><h3>Troca de Turma</h3><p>Relatório de embarque, desembarque e movimentação de tripulantes.</p></button><button class="tile" onclick="openReportForm('aso')"><div class="ico">🩺</div><h3>ASO / Medivac</h3><p>Relatório de atendimento em clínica, ASO ou Medivac.</p></button></div>`)}
function openReportForm(type){state.reportType=type;let common=`<div class="field"><label>Empresa / Grupo</label><input name="empresa" placeholder="Ex.: Cliente / grupo"></div><div class="field"><label>Unidade / Embarcação</label><input name="unidade" placeholder="Ex.: SKBU"></div><div class="field"><label>Data</label><input name="data" type="date" value="${new Date().toISOString().slice(0,10)}"></div><div class="field"><label>Preposto</label><input name="preposto" value="${esc(state.user.name)}"></div>`;
let form=type==='troca'?`${common}<div class="field"><label>Local de atendimento</label><input name="local" placeholder="Ex.: SBJR"></div><div class="field"><label>Modal</label><select name="modal"><option value="">Selecione</option><option>Aeroporto</option><option>Estaleiro</option><option>Porto</option></select></div><div class="field"><label>Início do atendimento</label><input name="inicio" type="time"></div><div class="field"><label>Encerramento</label><input name="fim" type="time"></div><div class="field"><label>Saída prevista do hotel</label><input name="saida_prev" type="time"></div><div class="field"><label>Saída real do hotel</label><input name="saida_real" type="time"></div><div class="field"><label>Embarque previsto</label><input name="embarque_prev" type="time"></div><div class="field"><label>Embarque real</label><input name="embarque_real" type="time"></div><div class="field full"><label>Descrição do atendimento / ocorrências</label><textarea name="descricao" placeholder="Descreva as atividades executadas, alterações, orientações e ocorrências..."></textarea></div><div class="field"><label>Tripulantes embarcados</label><textarea name="embarcados" placeholder="Nome dos tripulantes..."></textarea></div><div class="field"><label>Tripulantes desembarcados</label><textarea name="desembarcados" placeholder="Nome dos tripulantes..."></textarea></div>`:`${common}<div class="field"><label>Local de atendimento</label><input name="local" placeholder="Ex.: Clínica RedFlag"></div><div class="field"><label>Tipo de atendimento</label><select name="tipo_atendimento"><option value="">Selecione</option><option>ASO</option><option>Clínica</option><option>Medivac</option></select></div><div class="field"><label>Saída prevista</label><input name="saida_prev" type="time"></div><div class="field"><label>Saída real</label><input name="saida_real" type="time"></div><div class="field"><label>Atendimento previsto</label><input name="atendimento_prev" type="time"></div><div class="field"><label>Atendimento real</label><input name="atendimento_real" type="time"></div><div class="field"><label>Horário inicial</label><input name="horario_inicial" type="time"></div><div class="field"><label>Horário de finalização</label><input name="horario_final" type="time"></div><div class="field full"><label>Informações sobre o suporte</label><textarea name="suporte" placeholder="Registre as informações e orientações do atendimento..."></textarea></div><div class="field full"><label>Nome(s) dos tripulantes</label><textarea name="tripulantes" placeholder="Informe os nomes dos tripulantes..."></textarea></div>`;
shell(`${pageTitle(type==='troca'?'Relatório de Troca de Turma':'Relatório de ASO / Medivac','Preencha os dados do atendimento')}<div class="toolbar"><button class="btn secondary" type="button" onclick="report()">← Escolher outro tipo de relatório</button></div><div class="notice">Confira os dados antes de gerar a prévia do relatório.</div><form class="panel" id="reportForm" onsubmit="makeReport(event)"><div class="form-grid">${form}</div><div class="field full"><label>Adicionar imagens / documentos extras (opcional)</label><input name="anexos" id="reportImages" type="file" accept="image/*" multiple onchange="previewReportImages(event)"><small class="muted">Anexe fotos de documentos ou materiais enviados a bordo. As imagens serão incluídas no relatório.</small><div id="reportImagePreview" class="attachment-grid"></div></div><div class="toolbar"><button class="btn primary" type="submit">Gerar prévia do relatório</button><button class="btn secondary" type="reset">Limpar campos</button></div></form><div id="reportPreview"></div>`)}
function fileAsDataURL(file){return new Promise((resolve,reject)=>{let r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(file)})}
function previewReportImages(e){let files=[...(e.target.files||[])],box=document.getElementById('reportImagePreview');box.innerHTML='';files.forEach(f=>{let r=new FileReader();r.onload=()=>{let img=document.createElement('img');img.src=r.result;img.alt=f.name;img.title=f.name;box.appendChild(img)};r.readAsDataURL(f)})}
function reportEscape(v){return esc(String(v??'')).replaceAll('\n','<br>')}
function buildReportMarkup(d,logoSrc){
 const troca=d.tipo_relatorio==='Troca de Turma';
 const title=troca?'RELATÓRIO DE TROCA DE TURMA':'RELATÓRIO DE ASO/CLINICA';
 const field=(label,key)=>d[key]?`<div class="report-line"><strong>${label}:</strong> ${reportEscape(d[key])}</div>`:'';
 const timePair=(label,k1,k2,l1='Previsto',l2='Real')=>(d[k1]||d[k2])?`<div class="report-line"><strong>${label}:</strong><div class="report-indent"><strong>${l1}:</strong> ${reportEscape(d[k1]||'—')}　 <strong>${l2}:</strong> ${reportEscape(d[k2]||'—')}</div></div>`:'';
 const images=(d.imagens||[]).map((src,i)=>`<figure class="report-attachment"><img src="${src}" alt="Anexo ${i+1}"><figcaption>${reportEscape(d.nomes_anexos?.[i]||'Imagem anexada')}</figcaption></figure>`).join('');
 let body='';
 if(troca){
  body=`${field('Empresa / Grupo','empresa')}${field('Unidade','unidade')}${field('Data','data')}${field('Local','local')}${field('Modal','modal')}${timePair('Ponto de início (Previsto e Real)','saida_prev','saida_real')}${timePair('Horários de Embarque (Previsto e Real)','embarque_prev','embarque_real')}${(d.inicio||d.fim)?`<div class="report-line"><strong>Horário Inicial e de Finalização:</strong><div class="report-indent"><strong>Início:</strong> ${reportEscape(d.inicio||'—')}　<strong>Fim:</strong> ${reportEscape(d.fim||'—')}</div></div>`:''}${field('Nome do Preposto','preposto')}<div class="report-line"><strong>Informações sobre a troca de turma:</strong><div>${reportEscape(d.descricao||'N/A')}</div></div><div class="passenger-columns"><section><h3>Nomes Passageiros Embarcando:</h3><div>${reportEscape(d.embarcados||'N/A')}</div></section><section><h3>Nomes Passageiros Desembarcados:</h3><div>${reportEscape(d.desembarcados||'N/A')}</div></section></div>`;
 }else{
  body=`${field('Empresa / Grupo','empresa')}${field('Unidade','unidade')}${field('Data','data')}${field('Local','local')}${field('Modalidade de atendimento','tipo_atendimento')}${timePair('Horário de Saída (Previsto e Real)','saida_prev','saida_real')}${timePair('Horários do Atendimento (Previsto e Real)','atendimento_prev','atendimento_real')}${(d.horario_inicial||d.horario_final)?`<div class="report-line"><strong>Horário Inicial e de Finalização:</strong><div class="report-indent">${reportEscape(d.horario_inicial||'—')} às ${reportEscape(d.horario_final||'—')}</div></div>`:''}${field('Nome do Preposto','preposto')}<div class="report-line"><strong>Informações sobre o Suporte:</strong><div>${reportEscape(d.suporte||'N/A')}</div></div><div class="report-line"><strong>Nomes dos tripulantes:</strong><div>${reportEscape(d.tripulantes||'N/A')}</div></div>`;
 }
 const deco=`<div class="report-shape top"></div><div class="report-shape bottom-left"></div><div class="report-shape bottom-right"></div><header class="report-header"><img src="${logoSrc}" alt="MMS Suporte Logística"></header>`;
 const page1=`<article class="mms-report">${deco}<h1>${title}</h1><main>${body}</main></article>`;
 const page2=images?`<article class="mms-report report-images-page">${deco}<main><div class="report-images"><h3>Imagens / documentos anexados:</h3>${images}</div></main></article>`:'';
 return page1+page2;
}

function reportText(){let d=state.report;return 'MMS SUPORTE LOGÍSTICA\n'+(d.tipo_relatorio||'RELATÓRIO DE ATENDIMENTO')+'\n\n'+Object.entries(d).filter(([k,v])=>v&&k!=='tipo_relatorio'&&k!=='imagens'&&k!=='nomes_anexos').map(([k,v])=>k.replaceAll('_',' ').toUpperCase()+': '+v).join('\n')+(d.nomes_anexos?.length?'\n\nANEXOS: '+d.nomes_anexos.join(', '):'')}
function copyReport(){navigator.clipboard?.writeText(reportText()).then(()=>alert('Resumo copiado.')).catch(()=>alert('Não foi possível copiar automaticamente neste navegador.'))}
function reportDocumentHtml(d){let markup=buildReportMarkup(d,logo());return `<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Relatório MMS</title><style>${reportStyles()}body{margin:0;background:#fff}@media print{.mms-report{margin:0;box-shadow:none}}</style></head><body>${markup}</body></html>`}
async function loadHtml2PdfLibrary(){if(window.html2pdf)return;await new Promise((resolve,reject)=>{let sc=document.createElement('script');sc.src='https://cdn.jsdelivr.net/npm/html2pdf.js@0.10.1/dist/html2pdf.bundle.min.js';sc.onload=resolve;sc.onerror=()=>reject(new Error('Não foi possível carregar o gerador de PDF.'));document.head.appendChild(sc)})}
function downloadReportPdf(blob,fileName){let url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=fileName;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),30000)}
async function shareReportPdf(){
 if(!state.report||!Object.keys(state.report).length)return alert('Gere a prévia do relatório antes de compartilhar.');
 let data=state.report.data||new Date().toISOString().slice(0,10),safeDate=String(data).replace(/[^0-9-]/g,'');
 let fileName=`MMS_Relatorio_${state.report.tipo_relatorio==='Troca de Turma'?'Troca_de_Turma':'ASO_Medivac'}_${safeDate||'Atendimento'}.pdf`;
 let html=reportDocumentHtml(state.report);
 // No APK final, o bridge nativo gera o PDF e abre o compartilhamento Android (WhatsApp, e-mail etc.).
 if(window.NativeMMS&&typeof NativeMMS.shareHtmlAsPdf==='function'){
   try{NativeMMS.shareHtmlAsPdf(html,fileName);return}catch(err){console.warn('Compartilhamento nativo indisponível:',err)}
 }
 try{
   await loadHtml2PdfLibrary();
   // CORREÇÃO PDF EM BRANCO: o html2pdf clona o elemento recebido. Antes o elemento tinha position:fixed + translateX(-100vw)
   // (fora da tela), então o clone saía fora da área capturada e o PDF ficava branco. Agora enviamos o relatório "limpo",
   // com os estilos carregados no <head> da página.
   let st=document.getElementById('mmsReportPdfCss');if(!st){st=document.createElement('style');st.id='mmsReportPdfCss';document.head.appendChild(st)}
   st.textContent=reportStyles()+'.mms-report{margin:0!important;max-width:none!important;width:210mm!important;min-height:296mm!important;box-shadow:none!important;transform:none!important}';
   let tmp=document.createElement('div');tmp.style.cssText='position:fixed;left:-10000px;top:0;width:210mm;background:#fff;pointer-events:none';tmp.innerHTML=buildReportMarkup(state.report,logo());document.body.appendChild(tmp);let reportEl=tmp.firstElementChild;if(tmp.children.length>1){let inner=document.createElement('div');while(tmp.firstChild)inner.appendChild(tmp.firstChild);tmp.appendChild(inner);reportEl=inner}
   try{if(document.fonts&&document.fonts.ready)await document.fonts.ready}catch(_){}
   await Promise.all([...reportEl.querySelectorAll('img')].map(im=>new Promise(r=>{im.complete?r():(im.onload=im.onerror=r)})));
   window.scrollTo(0,0);
   let blob;try{blob=await html2pdf().set({margin:0,filename:fileName,image:{type:'jpeg',quality:.98},html2canvas:{scale:2,useCORS:true,backgroundColor:'#ffffff',logging:false,scrollX:0,scrollY:0},pagebreak:{mode:['css','legacy']},jsPDF:{unit:'mm',format:'a4',orientation:'portrait'}}).from(reportEl).toPdf().get('pdf').then(pdf=>{try{pdf.setDisplayMode('fullpage','single')}catch(_){}}).outputPdf('blob')}finally{tmp.remove()}
   if(!blob||blob.size<8000)throw new Error('PDF gerado vazio');

   let file=new File([blob],fileName,{type:'application/pdf'});
   if(navigator.share&&navigator.canShare&&navigator.canShare({files:[file]})){
     try{await navigator.share({files:[file],title:'Relatório MMS',text:'Relatório de atendimento – MMS'});return}catch(err){if(err&&err.name==='AbortError')return;console.warn('Compartilhamento Web indisponível:',err)}
   }
   downloadReportPdf(blob,fileName);
   alert('O PDF foi gerado e baixado. Neste computador, compartilhe o arquivo pelo WhatsApp ou e-mail. No APK final, será aberta diretamente a tela de compartilhamento do Android.');
 }catch(err){
   console.warn('Falha ao gerar PDF direto:',err);
   if(window.NativeMMS&&typeof NativeMMS.printHtml==='function'){NativeMMS.printHtml(html);return}
   let w=window.open('','_blank');if(!w)return alert('Não foi possível gerar o PDF. Permita a abertura de janelas ou tente novamente com internet.');
   w.document.open();w.document.write(html.replace('</body>','<script>window.onload=()=>window.print()<\\/script></body>'));w.document.close();
 }
}
function printReport(){return shareReportPdf()}
function ocr(){shell(`${pageTitle('Extrator de textos (OCR)','Reconheça apenas a área do documento que você selecionar')}<div class="notice">Depois de escolher a imagem, arraste o dedo ou mouse sobre ela para marcar somente a área que deseja transcrever. Se não fizer um recorte, o OCR usará a imagem inteira.</div><div class="panel"><div class="drop"><div class="big">📷</div><strong>Selecione uma imagem ou tire uma foto</strong><p>Formatos comuns de imagem · JPG, PNG e capturas de tela</p><div class="toolbar" style="justify-content:center"><label class="btn primary">Escolher imagem<input id="ocrFile" type="file" accept="image/*" hidden onchange="loadImage(event)"></label><label class="btn secondary">Abrir câmera<input id="ocrCamera" type="file" accept="image/*" capture="environment" hidden onchange="loadImage(event)"></label></div></div><div id="cropWrap" class="crop-wrap ${state.ocrImage?'':'hidden'}"><strong>Selecione a área para leitura</strong><p class="crop-help">Clique/toque e arraste para desenhar um retângulo em volta do trecho desejado.</p><div class="crop-stage" id="cropStage"><canvas id="cropCanvas"></canvas><div class="crop-box" id="cropBox"></div></div><div class="toolbar"><button class="btn secondary" type="button" onclick="resetCrop()">Usar imagem inteira</button><button class="btn outline" type="button" onclick="clearCrop()">Limpar seleção</button></div><p class="crop-help" id="cropStatus">Nenhuma área recortada: será usada a imagem inteira.</p></div><div class="toolbar"><button class="btn primary" onclick="runOCR()">Reconhecer texto da área selecionada</button><span id="ocrStatus" class="status"></span></div><div class="field"><label>Texto reconhecido (editável)</label><textarea id="ocrResult" class="ocr-text" placeholder="O texto extraído aparecerá aqui...">${esc(state.ocrText)}</textarea></div><div class="toolbar">${btn('Copiar texto','secondary','copyOCR()')} ${btn('Compartilhar','secondary','shareOCR()')} ${btn('Limpar','outline','clearOCR()')}</div></div>`);if(state.ocrImage)setupCropCanvas()}
function loadImage(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{state.ocrImage=r.result;state.ocrCrop=null;document.getElementById('cropWrap').classList.remove('hidden');setupCropCanvas()};r.readAsDataURL(f)}
let cropImageObj=null,cropStart=null,cropRect=null;
function setupCropCanvas(){let canvas=document.getElementById('cropCanvas');if(!canvas||!state.ocrImage)return;cropImageObj=new Image();cropImageObj.onload=()=>{canvas.width=cropImageObj.naturalWidth;canvas.height=cropImageObj.naturalHeight;canvas.getContext('2d').drawImage(cropImageObj,0,0);let box=document.getElementById('cropBox');box.style.display='none';cropRect=null;let stage=document.getElementById('cropStage');stage.onpointerdown=cropPointerDown;stage.onpointermove=cropPointerMove;stage.onpointerup=cropPointerUp;stage.onpointercancel=cropPointerUp;document.getElementById('cropStatus').textContent='Nenhuma área recortada: será usada a imagem inteira.'};cropImageObj.src=state.ocrImage}
function cropPoint(e){let c=document.getElementById('cropCanvas'),r=c.getBoundingClientRect();return{x:Math.max(0,Math.min(c.width,(e.clientX-r.left)*c.width/r.width)),y:Math.max(0,Math.min(c.height,(e.clientY-r.top)*c.height/r.height))}}
function cropPointerDown(e){e.preventDefault();e.currentTarget.setPointerCapture(e.pointerId);cropStart=cropPoint(e);cropRect={x:cropStart.x,y:cropStart.y,w:0,h:0};updateCropBox()}
function cropPointerMove(e){if(!cropStart)return;let p=cropPoint(e);cropRect={x:Math.min(cropStart.x,p.x),y:Math.min(cropStart.y,p.y),w:Math.abs(p.x-cropStart.x),h:Math.abs(p.y-cropStart.y)};updateCropBox()}
function cropPointerUp(e){if(!cropStart)return;cropPointerMove(e);cropStart=null;if(cropRect.w<8||cropRect.h<8){cropRect=null;document.getElementById('cropBox').style.display='none';document.getElementById('cropStatus').textContent='Seleção muito pequena. Arraste para marcar uma área maior.'}else{state.ocrCrop=cropRect;document.getElementById('cropStatus').textContent='Área selecionada. O OCR lerá somente este recorte.'}}
function updateCropBox(){let c=document.getElementById('cropCanvas'),r=c.getBoundingClientRect(),b=document.getElementById('cropBox');if(!cropRect)return;b.style.display='block';b.style.left=(cropRect.x/c.width*r.width)+'px';b.style.top=(cropRect.y/c.height*r.height)+'px';b.style.width=(cropRect.w/c.width*r.width)+'px';b.style.height=(cropRect.h/c.height*r.height)+'px'}
function resetCrop(){cropRect=null;state.ocrCrop=null;document.getElementById('cropBox').style.display='none';document.getElementById('cropStatus').textContent='Imagem inteira selecionada para leitura.'}

function compressImage(file,maxDim=1600,quality=.85){return fileAsDataURL(file).then(src=>new Promise((res,rej)=>{let img=new Image();img.onload=()=>{let r=Math.min(1,maxDim/Math.max(img.naturalWidth,img.naturalHeight));let c=document.createElement('canvas');c.width=Math.round(img.naturalWidth*r);c.height=Math.round(img.naturalHeight*r);let x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(img,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',quality))};img.onerror=rej;img.src=src}))}

function mmsProgramacaoParaLinha(x){

  'historico','_criadoPor','_atualizadoPor','dadosExtras'
 ]);
 const extras = {...(x.dadosExtras||{})};
 Object.keys(x).forEach(k=>{if(!fixos.has(k))extras[k]=x[k]});
 return {
  id:String(x.id),tipo:x.tipo,tipo_nome:x.tipoNome||'',
  data:x.data,empresa:x.empresa||'',localidade:x.localidade||'',

  hotel_tfmc:x.hotelTFMC||'',saida_tfmc:x.saidaTFMC||'',
  triagem:x.triagem||'',checkin:x.checkin||'',voo:x.voo||'',
  atendimento:x.atendimento||'',preposto:x.preposto||'',
  telefone:x.telefone||'',status:x.status||'Programado',

  historico:Array.isArray(x.historico)?x.historico:[],
  dados_extras:extras
 };
}

async function carregarProgramacoesSupabase(){
 if(!mmsSupabase||!state.user?.id)throw new Error('Usuário ou conexão Supabase não disponível.');

 const [p,s] = await Promise.all([
  mmsSupabase.from('mms_programacoes').select('*'),
  mmsSupabase.from('mms_programacao_sem_atendimento').select('*')
 ]);
 if(p.error)throw p.error;
 if(s.error)throw s.error;

 const remotas=(p.data||[]).map(mmsLinhaParaProgramacao);
 const locais=db().programacoes||[];
 const mapa=new Map(remotas.map(x=>[String(x.id),x]));
 const locaisParaEnviar=[];

 locais.forEach(x=>{
  const atual=mapa.get(String(x.id));
  if(!atual){
   mapa.set(String(x.id),x);
   locaisParaEnviar.push(x);
  }else if(new Date(x.atualizadoEm||0)>new Date(atual.atualizadoEm||0)){
   mapa.set(String(x.id),x);
   locaisParaEnviar.push(x);
  }
 });

 mmsProgramacoesCache=Array.from(mapa.values());
 const d=db();
 d.programacoes=mmsProgramacoesCache;

 const semAtendimento={};
 (s.data||[]).forEach(x=>{
  if(x.marcado){
   const data=String(x.data).slice(0,10);
   semAtendimento[data]=semAtendimento[data]||{};
   semAtendimento[data][x.localidade]=true;
  }
 });
 d.programacaoSemAtendimento=semAtendimento;
 saveDB(d);

 if(locaisParaEnviar.length){
  const {error}=await mmsSupabase.from('mms_programacoes')
   .upsert(locaisParaEnviar.map(mmsProgramacaoParaLinha),{onConflict:'id'});
  if(error)throw error;
 }
}

function getProgramacoes(){

}

function salvarProgramacoes(lista){
 const anteriores=mmsProgramacoesCache||[];
 const idsNovos=new Set((lista||[]).map(x=>String(x.id)));
 const removidos=anteriores.filter(x=>!idsNovos.has(String(x.id))).map(x=>String(x.id));
 const snapshot=(lista||[]).map(x=>({...x}));
 mmsProgramacoesCache=snapshot;
 const d=db();
 d.programacoes=snapshot;
 const ativos=new Set(snapshot.filter(x=>x.status!=='Cancelado').map(x=>`${x.data}::${x.localidade}`));
 if(d.programacaoSemAtendimento){
  Object.keys(d.programacaoSemAtendimento).forEach(data=>{
   Object.keys(d.programacaoSemAtendimento[data]||{}).forEach(localidade=>{
    if(ativos.has(`${data}::${localidade}`))delete d.programacaoSemAtendimento[data][localidade];
   });
   if(!Object.keys(d.programacaoSemAtendimento[data]||{}).length)delete d.programacaoSemAtendimento[data];
  });
 }
 saveDB(d);
 const linhas=snapshot.map(mmsProgramacaoParaLinha);
 mmsProgramacoesSyncPromise=mmsProgramacoesSyncPromise.then(async()=>{
  if(!mmsSupabase||!state.user?.id)throw new Error('Sessão ou conexão Supabase indisponível.');
  if(linhas.length){
   const {error}=await mmsSupabase.from('mms_programacoes').upsert(linhas,{onConflict:'id'});
   if(error)throw error;
  }
  if(removidos.length){
   const {error}=await mmsSupabase.from('mms_programacoes').delete().in('id',removidos);
   if(error)throw error;
  }
 }).catch(err=>{
  console.error('Erro ao sincronizar programações:',err);
  alert('Não foi possível sincronizar as programações com o Supabase: '+(err.message||err));
 });
}

function persistirSemAtendimentoSupabase(data,localidade,marcar){
 if(!mmsSupabase||!state.user?.id)return;
 const consulta=marcar
  ?mmsSupabase.from('mms_programacao_sem_atendimento').upsert({
    data,localidade,marcado:true,marcado_por:state.user.id,marcado_em:new Date().toISOString()
   },{onConflict:'data,localidade'})
  :mmsSupabase.from('mms_programacao_sem_atendimento').delete().eq('data',data).eq('localidade',localidade);

 consulta.then(({error})=>{
  if(error){
   console.error('Erro ao sincronizar ausência de atendimento:',error);
   alert('Erro ao salvar a marcação no Supabase: '+error.message);
  }
 });
